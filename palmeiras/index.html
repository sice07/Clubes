  const IND=[
    ['Custo de elenco ('+R.nome+')',y=>R.calc(y),'pct',y=>estado(R.calc(y)),'≤ '+R.rotulo],
    ['Dívida líquida de curto prazo sobre receita',y=>B.dividaCurtoSobreReceita(y),'pct',y=>B.dividaCurtoSobreReceita(y)<=0.45?'ok':B.dividaCurtoSobreReceita(y)<=0.6?'at':'ruim','≤ 45% (CBF, exercício de 2029)'],
    ['Dependência de receita não recorrente',y=>B.dependencia(y),'pct',y=>B.dependencia(y)<=0.25?'ok':B.dependencia(y)<=0.4?'at':'ruim','≤ 25% (convenção)'],
    ['Margem operacional (EBITDA total)',y=>B.margemEbitdaTotal(y),'pct',y=>B.margemEbitdaTotal(y)>=0.15?'ok':B.margemEbitdaTotal(y)>=0?'at':'ruim','≥ 15% (convenção)'],
    ['Liquidez corrente',y=>B.liquidezCorrente(y),'pct0',y=>B.liquidezCorrente(y)>=1?'ok':B.liquidezCorrente(y)>=0.5?'at':'ruim','≥ 100% (contábil)'],
    ['Passivo total sobre receita',y=>B.passivoSobreReceita(y),'pct',y=>B.passivoSobreReceita(y)<=1?'ok':B.passivoSobreReceita(y)<=2?'at':'ruim','≤ 100% (convenção)'],
    ['Patrimônio líquido (R$ mil)',y=>B.pl(y),'mil',y=>B.pl(y)>=0?'ok':'ruim','positivo'],
    ['Dívida financeira líquida (R$ mil)',y=>B.dividaLiquida(y),'mil',y=>B.dividaLiquida(y)<=0?'ok':'at','≤ caixa (convenção)'],
    ['Tributos parcelados (R$ mil)',y=>B.tributosTotais(y),'mil',()=> 'at',SEM_VALOR],
  ];
  let h='<div class="card" style="margin-top:16px"><h3>Painel de indicadores</h3><p class="sub">Situação por ano, com a referência adotada em cada métrica</p><div class="tw"><table class="t"><thead><tr><th>Indicador</th>'
    +a.map(y=>'<th>'+y+'</th>').join('')+'<th>Referência</th><th>Situação em '+ult+'</th></tr></thead><tbody>';
  IND.forEach(([nm,fn,tipo,st,ref])=>{
    h+='<tr><td>'+esc(nm)+'</td>'+a.map(y=>{
      const v=fn(y);
      const txt=tipo==='pct'?nf1.format(v*100)+'%':tipo==='pct0'?cob(v):tipo==='num'?nf2.format(v):fmt(v);
      return '<td class="n'+(v<0?' neg':'')+'">'+txt+'</td>';
    }).join('')+'<td>'+esc(ref)+'</td><td>'+B.selo(st(ult))+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  w.appendChild(node(h));
  const tribAnos=ANOS.filter(y=>YEARS.has(y)&&Object.values(DATA.df.tributos).some(l=>+l[String(y)]))
  if(tribAnos.length){
    const linhas=Object.keys(DATA.df.tributos);
    w.appendChild(node(`<div class="card" style="margin-top:16px"><h3>Composição dos tributos parcelados</h3><p class="sub">Parcelamentos por programa, conforme as notas explicativas de 2023 a 2025, em R$ mil</p>`
      +pivot({rows:linhas,cols:tribAnos,rowLabel:'Programa',total:false,
        valueFn:(k,c)=>DATA.df.tributos[k.item][String(c)]||0,
        totalFn:c=>linhas.reduce((s,l)=>s+(DATA.df.tributos[l][String(c)]||0),0)})+`</div>`));
  }
  w.appendChild(node('<div class="note" style="margin-top:16px">Só os tetos de custo de elenco e o limite de dívida de curto prazo vêm de norma. As faixas marcadas como convenção foram definidas para este painel a partir de prática de análise de crédito aplicada a clubes, e não têm respaldo normativo: servem para leitura rápida, não para classificação formal. O equilíbrio de 100% na liquidez corrente é definição contábil: é o ponto em que o ativo circulante iguala o passivo circulante.</div>'));
  w.appendChild(node('<div class="note" style="margin-top:12px">O denominador usado é a receita total do exercício, somando receita operacional e receita com negociação de atletas. Vale notar que a lei do PROFUT fala em receita bruta sem detalhar a composição: se apenas a receita operacional fosse considerada, o indicador de '+ult+' subiria de '+nf1.format(REFS.profut.calc(ult)*100)+'% para '+nf1.format(B.wageRatio(ult)*100)+'%.</div>'));
}},

/* ---------- Relatório ---------- */
{id:'relatorio',nome:'Relatório',grupo:'Saída',desc:'Diagnóstico, riscos e SWOT para impressão',render(w){
  /* o relatório sempre cobre a série auditada completa: um diagnóstico de um ano
     isolado não permite comparar evolução, então o filtro de anos não se aplica aqui */
  const a=ANOS.slice(), ult=a[a.length-1], ini=a[0];
  const bal=(g,c,y)=>B.b(g,c,y);
  const transfReceber=y=>B.transfNota('receber',y)||0;
  const transfPagar=y=>B.transfNota('pagar',y)||0;
  const posTransf=y=>transfReceber(y)-transfPagar(y);
  const lin=(y,l)=>sum(DATA.receitaBruta.filter(r=>r.ano===y&&r.linha===l));
  const transm=y=>lin(y,'Direitos de transmissão')+lin(y,'Premiações');
  const concentr=M.receitaOperacional(ult)?transm(ult)/M.receitaOperacional(ult):0;
  const margemRec=M.receitaOperacional(ult)?M.ebitda(ult)/M.receitaOperacional(ult):0;
  const R=refAtual();
  const V=v=>`<strong>${fmt(v)}</strong>`;

  const barra=node(`<div class="relbar"><span class="lbl">Versão do relatório</span>`
    +`<button class="chip${REL_TIPO==='exec'?' on':''}" data-t="exec">Executivo</button>`
    +`<button class="chip${REL_TIPO==='inv'?' on':''}" data-t="inv">Investimento</button>`
    +`<button class="btn-print">Imprimir ou salvar em PDF</button>`
    +`<span class="obs">Cobre sempre ${ini} a ${ult}, sem depender do filtro de anos</span></div>`);
  barra.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{REL_TIPO=b.dataset.t;go('relatorio');}));
  barra.querySelector('.btn-print').addEventListener('click',()=>window.print());
  w.appendChild(barra);

  const exec=REL_TIPO==='exec';
  const capa=(titulo,sub)=>`<div class="capa"><img src="${LOGO}" alt="Escudo do ${esc(CLUBE.nome)}">
    <div><h1>${esc(titulo)}</h1><div class="meta">${esc(sub)}</div></div></div>`;

  /* ---------- apoio ao texto ---------- */
  const SM=semMundial();
  const investElenco=y=>sum(DATA.custosTransferencia.filter(r=>r.ano===y));
  const folhaCresce=B.folha(ult-1)?B.folha(ult)/B.folha(ult-1)-1:0;
  const folhaSobreRec=M.receitaOperacional(ult)?B.folha(ult)/M.receitaOperacional(ult):0;
  const custoSemMundial=(B.folha(ult)+B.amortElenco(ult))/(B.receitaTotal(ult)-SM.liquida);
  const patr=y=>lin(y,'Publicidade e patrocínio');
  const caixa=y=>bal('ativoCirculante','Caixa e equivalentes',y);
  const anosEbitdaPos=a.filter(y=>M.ebitda(y)>0);
  const vezesPrem=SM.premiacaoAnt?SM.premiacao/SM.premiacaoAnt:0;
  const confere=Math.abs(M.resultado(ult)-B.dre('superavit',ult))<100;
  const CONT_POSSIVEIS=B.transfNota('contingenciasPossiveis',ult)||0;
  const adiant=y=>bal('passivoCirculante','Antecipação de contratos',y)+bal('passivoNaoCirculante','Antecipação de contratos (LP)',y);
  const ALLIANZ=366725; /* saldo do contrato de superfície em 31/12/2025, nota de antecipação de contratos */
  const vendasTop=(y,n)=>DATA.transferencias.filter(r=>r.ano===y&&r.contraparte!=='Diversos').sort((p,q)=>q.valor-p.valor).slice(0,n);
  const APELIDO={'Vitor de Oliveira Nunes dos Reis':'Vitor Reis','Estêvão Willian Almeida de Oliveira Gonçalves':'Estêvão','Richard Ríos Montoya':'Richard Ríos','Endrick Felipe Moreira de Sousa':'Endrick','Luis Guilherme Lira dos Santos':'Luis Guilherme','Artur Victor Guimarães':'Artur'};
  const top3=vendasTop(ult,3).map(r=>APELIDO[r.atleta]||r.atleta).join(', ');

  /* ---------- riscos, ordenados por severidade ---------- */
  const riscos=[
    {n:'Operação recorrente sem o Mundial',sev:SM.ebitdaSem<0?'alto':SM.ebitdaSem<M.ebitda(ult-1)?'medio':'baixo',
     ev:`EBITDA recorrente de ${fmt(M.ebitda(ult))} em ${ult}, ou ${fmt(SM.ebitdaSem)} sem a premiação do Mundial`,
     im:`A premiação do Mundial de Clubes, de ${fmt(MUNDIAL.bruta)} brutos, é maior que todo o EBITDA recorrente do ano. Sem ela a operação de ${ult} ficaria negativa, com a folha subindo ${pct(folhaCresce)} no mesmo exercício. O torneio só volta em 2029.`},
    {n:'Compromissos com transferências',sev:posTransf(ult)<-0.2*B.receitaTotal(ult)?'alto':posTransf(ult)<0?'medio':'baixo',
     ev:`${fmt(transfPagar(ult))} a pagar a clubes e agentes contra ${fmt(transfReceber(ult))} a receber por vendas, saldo de ${fmt(posTransf(ult))}`,
     im:`O clube investiu ${fmt(investElenco(ult))} em elenco em ${ult}, o maior valor da série, boa parte a prazo e em moeda estrangeira. As parcelas a pagar superam com folga as vendas a receber e comprometem o caixa dos próximos exercícios antes de qualquer receita nova.`},
    {n:'Dependência de venda de atletas',sev:B.dependencia(ult)<=0.25?'baixo':B.dependencia(ult)<=0.4?'medio':'alto',
     ev:`Transferências responderam por ${nf1.format(B.dependencia(ult)*100)}% da receita total de ${ult} e ${nf1.format(B.dependencia(ult-1)*100)}% em ${ult-1}`,
     im:`Os dois últimos exercícios tiveram as maiores vendas da série, com ${esc(top3)} em ${ult}. O resultado passou a depender da base formada no clube, e esse fluxo não é garantido de ano para ano.`},
    {n:'Liquidez de curto prazo',sev:B.liquidezCorrente(ult)<0.7?'alto':B.liquidezCorrente(ult)<1?'medio':'baixo',
     ev:`O ativo circulante cobre ${cob(B.liquidezCorrente(ult))} do passivo circulante, com capital circulante líquido de ${fmt(B.capitalCirculante(ult))}`,
     im:'A cobertura está abaixo do equilíbrio de 100% em todos os anos da série. Parte do passivo circulante é antecipação de contratos, que não sai do caixa, mas o grosso são parcelas de contratações que vencem em doze meses.'},
    {n:'Exposição cambial',sev:'medio',
     ev:`Variação cambial passiva de ${fmt(sum(DATA.despesaFinanceira.filter(r=>r.ano===ult&&r.linha==='Variação cambial passiva').map(r=>({valor:r.valorPos}))))} e ativa de ${fmt(sum(DATA.receitaFinanceira.filter(r=>r.ano===ult&&r.linha==='Variação cambial ativa')))} em ${ult}`,
     im:'O clube compra e vende atletas em euro e dólar, e o resultado financeiro oscila com o câmbio. Com as obrigações no exterior subindo mais que os créditos, a exposição passou a ser líquida devedora.'},
    {n:'Crescimento da folha',sev:R.calc(ult)>R.limite/100?'alto':folhaCresce>0.2?'medio':'baixo',
     ev:`Folha de ${fmt(B.folha(ult))} em ${ult}, alta de ${pct(folhaCresce)} sobre ${ult-1}`,
     im:`Pessoal, encargos, premiações ao elenco e direito de imagem equivalem a ${nf1.format(folhaSobreRec*100)}% da receita operacional. Parte da alta de ${ult} são premiações por desempenho, que recuam se as campanhas não se repetirem, mas a folha fixa também subiu.`},
    {n:'Enquadramento no fair play da CBF',sev:(REFS.cbf.calc(ult)<=0.7&&B.dividaCurtoSobreReceita(ult)<=0.45)?'baixo':'medio',
     ev:`Custo de elenco em ${nf1.format(REFS.cbf.calc(ult)*100)}% e dívida líquida de curto prazo em ${nf1.format(B.dividaCurtoSobreReceita(ult)*100)}% da receita do exercício`,
     im:`Os dois indicadores ficam dentro dos limites de 70% e 45% exigidos a partir do exercício de 2029. Sem a premiação do Mundial o custo de elenco iria a ${nf1.format(custoSemMundial*100)}%. A folga depende de a receita com vendas seguir alta, porque ela entra na base de cálculo.`},
    {n:'Contingências',sev:CONT_POSSIVEIS>0.1*B.receitaTotal(ult)?'medio':'baixo',
     ev:`${fmt(bal('passivoNaoCirculante','Provisão para contingências',ult))} provisionados e ${fmt(CONT_POSSIVEIS)} em processos com perda possível sem provisão`,
     im:'O acordo global com a Real Arenas encerrou em 2024 as disputas judiciais e arbitrais sobre o Allianz Parque, e os processos com perda possível vêm caindo desde 2023. A provisão subiu em 2025 com novas ações cíveis.'},
    {n:'Passivo tributário parcelado',sev:'baixo',
     ev:`${fmt(B.tributosTotais(ult))} em ${ult}, contra ${fmt(B.tributosTotais(ini))} em ${ini}`,
     im:'O saldo subiu em 2024 com o parcelamento do ISS sobre bilheteria, feito com desconto de 95% em juros e multa. O Refis da Copa e o Timemania seguem em amortização e não havia parcelas vencidas no fim de 2025.'},
  ];
  const ordem={alto:0,medio:1,baixo:2};
  riscos.sort((x,y)=>ordem[x.sev]-ordem[y.sev]);
  const selRisco=s2=>s2==='alto'?B.selo('ruim','Alto'):s2==='medio'?B.selo('at','Médio'):B.selo('ok','Baixo');
  const corSev={alto:'var(--bad)',medio:'var(--warn)',baixo:'var(--s2)'};
  const tabelaRiscos=()=>'<div class="riscos">'
    +riscos.map(r=>`<div class="risco" style="--sev:${corSev[r.sev]}">
        <div class="rt"><b>${esc(r.n)}</b>${selRisco(r.sev)}</div>
        <p>${esc(r.im)}</p>
        <p class="ev">${esc(r.ev)}</p></div>`).join('')
    +'</div>';
  /* ---------- SWOT ---------- */
  const swot=(f,fr,o,am)=>`<div class="swot">
    <div class="q qf"><h4>Forças</h4><ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="q qw"><h4>Fraquezas</h4><ul>${fr.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="q qo"><h4>Oportunidades</h4><ul>${o.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="q qt"><h4>Ameaças</h4><ul>${am.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const rodapeCapa=`${CLUBE.oficial} · exercícios de ${ini} a ${ult} · valores em R$ mil · emitido em ${hoje}`;
  const avisoFonte=`Relatório gerado a partir das demonstrações contábeis publicadas pelo clube de ${ini} a ${ult}. Os anos de 2020 a 2022 vêm das demonstrações sem notas explicativas, e por isso alguns detalhamentos começam em 2023. ${a.filter(y=>Math.abs(M.resultado(y)-B.dre('superavit',y))>=100).length?'Há divergência em relação ao publicado, detalhada na página de Demonstração de Resultados.':'O resultado do painel confere com o superávit publicado em todos os anos.'}`;
  if(exec){
    /* ================= RELATÓRIO EXECUTIVO ================= */
    w.appendChild(node(`<div class="folha">${capa('Relatório executivo de saúde financeira',rodapeCapa)}
      <p class="eyebrow">Sumário</p>
      <p><strong>${ult} foi o maior exercício da série, com receita total de ${fmt(B.receitaTotal(ult))} e superávit de ${fmt(M.resultado(ult))}.</strong> A receita operacional chegou a ${V(M.receitaOperacional(ult))} e as vendas de atletas somaram ${V(M.receitaExtra(ult))}, o maior valor da série. O EBITDA recorrente, que mede a operação sem venda de atletas, foi de ${V(M.ebitda(ult))}, com margem de ${nf1.format(margemRec*100)}%.</p>
      <p>Boa parte desse desempenho veio de um calendário que não se repete. As premiações somaram ${V(SM.premiacao)}, ${nf1.format(vezesPrem)} vezes o valor de ${ult-1}, puxadas pelo Mundial de Clubes. Sem o Mundial o EBITDA recorrente seria de ${V(SM.ebitdaSem)}, e sem nenhuma premiação a receita operacional ficaria em ${V(SM.semPrem)}, ${compara(SM.semPrem,SM.semPremAnt)} de ${ult-1}.</p>
      <p>O balanço é o mais forte da série. O patrimônio líquido saiu de ${V(B.pl(ini))} em ${ini}, quando o passivo superava o ativo, para ${V(B.pl(ult))}, e a dívida com bancos foi praticamente zerada. O ponto de atenção está nas contratações, com ${V(transfPagar(ult))} a pagar a clubes e agentes contra ${V(transfReceber(ult))} a receber, o que deixa a liquidez corrente em <strong>${cob(B.liquidezCorrente(ult))}</strong>.</p>
      <p>O resultado calculado pelo painel foi de ${V(M.resultado(ult))}, ${confere?'igual ao':'contra o'} superávit de ${V(B.dre('superavit',ult))} publicado na demonstração auditada.</p>
      <h3>Indicadores do exercício</h3>
      <div class="grid g4" style="margin-top:10px">
      ${kpi('Receita operacional',fmt(M.receitaOperacional(ult)),'R$ mil',sc(1))}
      ${kpi('EBITDA recorrente',fmt(M.ebitda(ult)),'Margem de '+nf1.format(margemRec*100)+'%',M.ebitda(ult)>=0?'var(--s2)':'var(--bad)')}
      ${kpi('Patrimônio líquido',fmt(B.pl(ult)),B.pl(ult)<0?'Passivo a descoberto':'Positivo',B.pl(ult)<0?'var(--bad)':'var(--s2)')}
      ${kpi('Liquidez corrente',cob(B.liquidezCorrente(ult)),'Do passivo circulante. Equilíbrio em 100%',B.liquidezCorrente(ult)<1?'var(--bad)':'var(--s2)')}
      </div>
      ${cenarioMundial(true,true)}</div>`));
    const f2=node(`<div class="folha"><p class="eyebrow">Diagnóstico</p><h2>Como o clube chegou até aqui</h2>
      <p>Entre ${ini} e ${ult} a receita operacional saiu de ${V(M.receitaOperacional(ini))} para ${V(M.receitaOperacional(ult))}, ${nf1.format(M.receitaOperacional(ult)/M.receitaOperacional(ini))} vezes o valor inicial. ${ini} foi o ano da pandemia, com estádios fechados e parte da temporada empurrada para ${ini+1}, o que explica o pico de ${ini+1}. De ${ini+2} a ${ult-1} a receita operacional ficou entre ${fmt(Math.min(M.receitaOperacional(ini+2),M.receitaOperacional(ini+3),M.receitaOperacional(ini+4)))} e ${fmt(Math.max(M.receitaOperacional(ini+2),M.receitaOperacional(ini+3),M.receitaOperacional(ini+4)))}, e o salto de ${ult} veio de patrocínio e premiações.</p>
      <p>A folha de pessoal, premiações ao elenco e direito de imagem responde por <strong>${nf1.format(B.folha(ult)/M.custosTotais(ult)*100)}%</strong> do custo operacional. Pelo critério do ${esc(R.nome)}, o custo de elenco equivale a <strong>${nf1.format(R.calc(ult)*100)}%</strong> da receita, ${R.calc(ult)<=R.limite/100?'dentro':'acima'} do teto de ${esc(R.rotulo)}.</p>
      <p>A venda de atletas respondeu por <strong>${nf1.format(B.dependencia(ult)*100)}%</strong> da receita total de ${ult}, contra <strong>${nf1.format(B.dependencia(ini)*100)}%</strong> em ${ini}. O EBITDA recorrente foi positivo em ${anosEbitdaPos.length} dos ${a.length} anos, mas com margem estreita de ${ini+2} a ${ult-1}, e parte dele vem do contrato de superfície do Allianz Parque. O que as vendas financiaram foi a reposição e o reforço do elenco, que recebeu ${V(investElenco(ult))} em ${ult}.</p>
      <h3>Evolução do resultado</h3></div>`);
    f2.appendChild(card({title:'EBITDA recorrente e resultado líquido',sub:'Em R$ mil, por ano',type:'bars',cats:a.map(String),catLabel:'Ano',height:300,
      series:[{name:'EBITDA recorrente',data:a.map(M.ebitda),color:sc(0)},{name:'Resultado líquido',data:a.map(M.resultado),color:sc(1)}]}));
    w.appendChild(f2);
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Riscos</p><h2>Pontos de atenção, do mais grave ao menos grave</h2>
      <p>A classificação abaixo considera a severidade para a continuidade da operação nos próximos doze a vinte e quatro meses.</p>
      ${tabelaRiscos()}</div>`));
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Síntese</p><h2>Análise SWOT</h2>
      ${swot(
        [`Patrimônio líquido de <b>${fmt(B.pl(ult))}</b>, contra ${fmt(B.pl(ini))} em ${ini}`,
         `Dívida bancária praticamente zerada e caixa de <b>${fmt(caixa(ult))}</b> no fim de ${ult}`,
         `Formação de atletas com vendas de <b>${fmt(lin(ult,'Transferências de atletas e mecanismo de solidariedade'))}</b> em ${ult} e ${fmt(lin(ult-1,'Transferências de atletas e mecanismo de solidariedade'))} em ${ult-1}`,
         `Patrocínio de <b>${fmt(patr(ult))}</b> em ${ult}, com novos contratos no masculino, no feminino e na base`,
         `Receita estável do Allianz Parque e do Avanti, somando <b>${fmt(lin(ult,'Contrato de superfície do Allianz Parque')+lin(ult,'Sócio torcedor Avanti'))}</b> no ano`],
        [`Saldo devedor de <b>${fmt(Math.abs(posTransf(ult)))}</b> em transferências já contratadas`,
         `Liquidez corrente de <b>${cob(B.liquidezCorrente(ult))}</b> do passivo circulante`,
         `EBITDA recorrente negativo em ${ult} quando se tira o Mundial`,
         `Folha em alta de <b>${pct(folhaCresce)}</b> no ano`,
         `Amortização de elenco de <b>${fmt(B.amortElenco(ult))}</b>, o dobro de ${ult-1}, que acompanha as contratações`],
        [`Contrato do Brasileiro com a LIBRA de 2025 a 2029, com parte já antecipada ao clube`,
         `Base com histórico de vendas recordes para a Europa`,
         `Receita de patrocínio em alta, com espaço no futebol feminino e na base`,
         `Regulação nova da CBF favorece quem já está enquadrado`,
         `Balanço sem dívida bancária, com espaço para financiar investimentos`],
        [`Pressão de custos se as campanhas de ${ult} não se repetirem`,
         `Parcelas de contratações concentradas nos próximos 24 meses`,
         `Variação cambial sobre as obrigações em euro e dólar`,
         `Processos com perda possível de <b>${fmt(CONT_POSSIVEIS)}</b> sem provisão`,
         `Mercado de vendas mais disputado, com resultado sujeito ao calendário das janelas`])}
      </div>`));
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Conclusão</p><h2>O que acompanhar nos próximos exercícios</h2>
      <p>A pergunta de ${ult+1} é quanto da receita de ${ult} se sustenta sem o Mundial e sem vendas recordes. Quatro números respondem.</p>
      <p>A <strong>receita operacional sem premiações</strong> foi de ${fmt(SM.semPrem)} em ${ult}, ${compara(SM.semPrem,SM.semPremAnt)} de ${ult-1}. Ela precisa seguir crescendo para acompanhar a folha, que subiu ${pct(folhaCresce)} no mesmo período.</p>
      <p>O <strong>saldo de transferências</strong> precisa voltar ao equilíbrio. Com ${fmt(transfPagar(ult))} a pagar, as vendas dos próximos exercícios já nascem comprometidas com parcelas de contratações feitas antes.</p>
      <p>A <strong>liquidez corrente</strong> ficou abaixo de 100% em todos os anos da série, com o melhor nível em ${a.reduce((m,y)=>B.liquidezCorrente(y)>B.liquidezCorrente(m)?y:m,ini)}. Subir esse índice depende de reduzir as parcelas de curto prazo com clubes e agentes.</p>
      <p>A <strong>margem do EBITDA recorrente</strong> ficou perto de 10% de ${ini+2} a ${ult-1}. Sustentar a operação no azul sem premiações excepcionais é o que separa um clube que investe com a própria operação de um que precisa vender para pagar a folha.</p>
      <p>Se esses números se mantiverem, ${ult} terá sido o topo de um ciclo de crescimento com balanço saudável. Se a folha e as parcelas de contratações seguirem subindo mais que a receita recorrente, a folga construída desde ${ini} começa a ser consumida.</p>
      <div class="aviso">${avisoFonte}</div></div>`));
  } else {
    /* ================= RELATÓRIO DE INVESTIMENTO ================= */
    w.appendChild(node(`<div class="folha">${capa('Relatório de análise para investimento',rodapeCapa)}
      <p class="eyebrow">Tese em uma página</p>
      <p><strong>O que é o ativo.</strong> Uma operação que faturou ${V(B.receitaTotal(ult))} em ${ult}, sendo ${V(M.receitaOperacional(ult))} de receita operacional, com marca de alcance nacional, base física de ${V(bal('ativoNaoCirculante','Imobilizado',ult))} em imobilizado, que inclui o Allianz Parque, e elenco registrado em ${V(bal('ativoNaoCirculante','Intangível',ult))} de intangível.</p>
      <p><strong>A estrutura de capital.</strong> Patrimônio líquido positivo de ${V(B.pl(ult))}, passivo de ${V(B.t('passivoTotal',ult))} e dívida bancária de ${V(B.dividaBruta(ult))}. O ${CLUBE.nome} é uma associação sem fins lucrativos e não uma SAF, então uma entrada de capital passaria por parceria em ativos ou receitas específicas, e não pela compra do futebol.</p>
      <p><strong>O que o exercício mostra.</strong> O EBITDA recorrente foi positivo em ${anosEbitdaPos.length} dos ${a.length} anos, com ${V(M.ebitda(ult))} em ${ult}. Sem o Mundial esse número seria de ${V(SM.ebitdaSem)}, e o resultado do ano se apoia nas vendas de atletas.</p>
      <p><strong>O risco central.</strong> Não está na dívida bancária, e sim no ritmo de investimento em elenco. O clube tem ${V(transfPagar(ult))} a pagar por contratações e uma folha que subiu ${pct(folhaCresce)} em um ano. A tese depende de a receita recorrente crescer no mesmo passo e de as vendas seguirem em nível alto.</p>
      <div class="grid g4" style="margin-top:14px">
      ${kpi('Receita total '+ult,fmt(B.receitaTotal(ult)),'Operacional mais transferências',sc(1))}
      ${kpi('EBITDA total '+ult,fmt(M.ebitdaTotal(ult)),'Com negociação de atletas',sc(3))}
      ${kpi('Dívida financeira líquida',fmt(B.dividaLiquida(ult)),'Empréstimos menos caixa',sc(2))}
      ${kpi('Compromissos com transferências',fmt(transfPagar(ult)),'A pagar a clubes e agentes','var(--bad)')}
      </div></div>`));
    const f2=node(`<div class="folha"><p class="eyebrow">Qualidade do ativo</p><h2>De onde vem o dinheiro e quanto dele é recorrente</h2>
      <p>A receita total de ${ult} foi de ${V(B.receitaTotal(ult))}, dos quais ${V(M.receitaOperacional(ult))} operacionais e ${V(M.receitaExtra(ult))} vindos de negociação de atletas. A parcela de vendas foi de ${nf1.format(B.dependencia(ult)*100)}% da receita total, contra ${nf1.format(B.dependencia(ini)*100)}% em ${ini}.</p>
      <p>Dentro da receita operacional, <strong>${nf1.format(concentr*100)}%</strong> vem de direitos de transmissão e premiações, e só as premiações do Mundial somaram ${V(MUNDIAL.bruta)} brutos. Patrocínio somou ${V(patr(ult))}, e Avanti, bilheteria, Allianz Parque e clube social completam uma base sobre a qual a gestão tem controle direto.</p>
      <p>A geração de caixa operacional foi de ${V(B.f('operacional',ult))} em ${ult}, número que inclui o recebimento das vendas de atletas, e o investimento consumiu ${V(Math.abs(B.f('investimento',ult)))} no mesmo exercício, quase todo em direitos de atletas.</p>
      <h3>Receita recorrente e não recorrente</h3></div>`);
    f2.appendChild(card({title:'Composição da receita total',sub:'Em R$ mil, empilhado por ano',type:'bars',stacked:true,cats:a.map(String),catLabel:'Ano',height:300,
      series:[{name:'Receita operacional recorrente',data:a.map(M.receitaOperacional),color:sc(1)},
              {name:'Transferências e extraordinárias',data:a.map(M.receitaExtra),color:sc(0)}]}));
    w.appendChild(f2);
    const conting=y=>bal('passivoNaoCirculante','Provisão para contingências',y);
    const trab=y=>bal('passivoCirculante','Obrigações trabalhistas',y);
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Estrutura de capital</p><h2>O que está no balanço</h2>
      <p>O ativo total de ${ult} é de ${V(B.t('ativoTotal',ult))}, com ${V(bal('ativoNaoCirculante','Imobilizado',ult))} de imobilizado, onde está o Allianz Parque, e ${V(bal('ativoNaoCirculante','Intangível',ult))} de intangível, formado pelos direitos de atletas e pelas luvas.</p>
      <p>O passivo de ${V(B.t('passivoTotal',ult))} se concentra em títulos a pagar a clubes e agentes (${V(transfPagar(ult))}), adiantamentos de contratos (${V(adiant(ult))}) e tributos parcelados (${V(B.tributosTotais(ult))}). Dos adiantamentos, ${V(ALLIANZ)} são o contrato de superfície do Allianz Parque, receita já recebida que será reconhecida até 2044 sem saída de caixa.</p>
      <p>Para quem avalia uma parceria, o ponto relevante é que <strong>não há dívida bancária relevante</strong>. O caixa de ${V(caixa(ult))} supera os empréstimos. O que pesa no curto prazo são as parcelas de contratações, e isso se resolve com disciplina de investimento, não com refinanciamento.</p>
      <h3>Estrutura patrimonial em ${ult}</h3>
      ${(()=>{
        const pt=B.t('passivoTotal',ult);
        const partes=[
          ['Títulos a pagar a clubes e agentes',transfPagar(ult)],
          ['Adiantamentos de contratos',adiant(ult)],
          ['Tributos parcelados',B.tributosTotais(ult)],
          ['Provisão para contingências',conting(ult)],
          ['Obrigações trabalhistas',trab(ult)],
          ['Empréstimos e financiamentos',B.dividaBruta(ult)],
        ];
        const resto=pt-partes.reduce((s2,p)=>s2+p[1],0);
        const linhas=[
          ['Ativo circulante',B.t('ativoCirculante',ult),null],
          ['Ativo não circulante',B.t('ativoNaoCirculante',ult),null],
          ['Total do ativo',B.t('ativoTotal',ult),null,'hl'],
          ...partes.map(p=>[p[0],p[1],p[1]/pt]),
          ['Demais passivos',resto,resto/pt],
          ['Total do passivo',pt,1,'hl'],
          ['Patrimônio líquido',B.pl(ult),null,'hl'],
        ];
        return '<div class="tw"><table class="t dre"><thead><tr><th>Conta</th><th>R$ mil</th><th>Do passivo</th></tr></thead><tbody>'
          +linhas.map(([n,v,pc,cls])=>`<tr${cls?' class="'+cls+'"':''}><td>${esc(n)}</td><td class="n${v<0?' neg':''}">${fmt(v)}</td><td>${pc==null?SEM_VALOR:nf1.format(pc*100)+'%'}</td></tr>`).join('')
          +'</tbody></table></div>';
      })()}
      </div>`));
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Diligência</p><h2>Riscos a verificar antes de qualquer proposta</h2>
      <p>Além do que aparece nas demonstrações, uma diligência precisaria confirmar o cronograma das parcelas de contratações e a moeda de cada uma, as metas e bônus previstos nos contratos de venda, a exposição em processos com perda possível, hoje em ${fmt(CONT_POSSIVEIS)}, e os termos do contrato de superfície do Allianz Parque com a Real Arenas, que vai até 2044.</p>
      ${tabelaRiscos()}
      ${cenarioMundial(true,true)}</div>`));
    w.appendChild(node(`<div class="folha"><p class="eyebrow">Síntese</p><h2>Análise SWOT sob a ótica do investidor</h2>
      ${swot(
        [`Receita total de <b>${fmt(B.receitaTotal(ult))}</b> com uma das marcas mais fortes do futebol brasileiro`,
         `Dívida financeira líquida de <b>${fmt(B.dividaLiquida(ult))}</b>, ou seja, mais caixa que empréstimos`,
         `Patrimônio líquido positivo de <b>${fmt(B.pl(ult))}</b>`,
         `Base formadora com vendas de <b>${fmt(M.receitaExtra(ult))}</b> em ${ult}`,
         `Estádio moderno com receita contratada até 2044`],
        [`Compromissos de <b>${fmt(transfPagar(ult))}</b> com contratações`,
         `Capital circulante líquido de <b>${fmt(B.capitalCirculante(ult))}</b>`,
         `Operação recorrente dependente de premiações para ter margem relevante`,
         `Associação sem fins lucrativos, sem mecanismo de entrada de capital no futebol`,
         `Resultado muito sensível ao volume anual de vendas`],
        [`Contrato do Brasileiro até 2029 com base fixa maior`,
         `Patrocínio em alta no masculino, no feminino e na base`,
         `Curva de receita operacional multiplicada por <b>${nf1.format(M.receitaOperacional(ult)/M.receitaOperacional(ini))}</b> em ${ult-ini} anos`,
         `Regulação nova da CBF favorece quem já está enquadrado`,
         `Mercado europeu comprador de jovens formados no clube`],
        [`Fair play da CBF com cobrança plena em 2028 e punições esportivas`,
         `Saldo devedor de <b>${fmt(Math.abs(posTransf(ult)))}</b> em transferências pressiona o caixa dos próximos exercícios`,
         `Dependência de desempenho esportivo para sustentar a parte variável da receita`,
         `Exposição cambial nas compras de atletas no exterior`,
         `Folha em alta que não recua na mesma velocidade das receitas variáveis`])}
      <h3>Condicionantes da tese</h3>
      <p>A tese se sustenta se três condições forem verdadeiras ao mesmo tempo. A operação recorrente precisa ficar positiva sem premiações excepcionais. O saldo de transferências precisa voltar ao equilíbrio. E a venda de atletas precisa seguir financiando o investimento em elenco sem aumentar as parcelas de curto prazo. Se qualquer uma falhar, o balanço sólido de hoje passa a financiar custos correntes em vez de crescimento.</p>
      <div class="aviso">Este documento reúne e organiza informações das demonstrações contábeis de ${ini} a ${ult}. Não constitui recomendação de investimento, avaliação econômica formal, laudo de avaliação nem oferta. Qualquer decisão exige diligência independente e assessoria própria. O autor não é consultor de investimentos.</div></div>`));
  }
}},

/* ---------- 12. Referências ---------- */
{id:'ref',nome:'Referências e Informações',grupo:'Apoio',desc:'Metodologia, indicadores e fontes',render(w){
  w.innerHTML=sec('Referências e outras informações','Metodologia, definições e fontes do painel');
  w.appendChild(grid('g2',
    `<div class="card prose">
      <h3 style="margin-bottom:8px">Metodologia</h3>
      <p>Este painel foi desenvolvido com base nas melhores práticas internacionais de análise financeira aplicadas à indústria do futebol, utilizando como principais referências metodológicas os relatórios da <strong>Deloitte Football Money League</strong>, os regulamentos de <strong>Fair Play Financeiro da UEFA</strong>, modelos de análise de clubes estruturados por instituições financeiras e relatórios oficiais de demonstrações financeiras publicados por clubes brasileiros e europeus.</p>
      <p>A estrutura do modelo segue a separação padrão entre receitas operacionais, resultado com negociação de atletas, custos operacionais, resultado financeiro e resultado líquido, permitindo uma visão clara da sustentabilidade operacional e da dependência de receitas não recorrentes.</p>
      <p>Os valores apresentados estão em <strong>milhares de reais (R$ mil)</strong> e refletem exclusivamente informações extraídas das demonstrações financeiras oficiais do clube.</p>
    </div>`,
    `<div class="card prose">
      <h3 style="margin-bottom:8px">Indicadores financeiros</h3>
      <p><strong>Receita operacional:</strong> receitas recorrentes das atividades principais do clube: direitos de transmissão, patrocínios, sócio-torcedor e bilheteria.</p>
      <p><strong>Resultado com negociação de atletas:</strong> impacto financeiro líquido das transferências, permitindo avaliar o grau de dependência de receitas não recorrentes.</p>
      <p><strong>EBITDA:</strong> capacidade de gerar resultado a partir das operações principais, desconsiderando efeitos contábeis e financeiros.</p>
      <p><strong>Resultado operacional (EBIT):</strong> resultado após depreciações e amortizações, refletindo o desempenho operacional completo.</p>
      <p><strong>Resultado financeiro:</strong> efeitos de juros, encargos financeiros e variações cambiais, demonstrando o impacto da estrutura de endividamento.</p>
      <p><strong>Resultado líquido:</strong> resultado final do período, consolidando todos os efeitos operacionais, financeiros e não recorrentes.</p>
    </div>`));
  const LINKS={
    profut:{url:'https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13155.htm',texto:'Lei 13.155/2015 no Planalto'},
    cbf:{url:'https://ge.globo.com/sp/futebol/noticia/2025/11/26/cbf-anuncia-o-fair-play-financeiro-veja-regras-punicoes-e-cronograma.ghtml',texto:'Regras, punições e cronograma no ge'},
    uefa:{url:'https://www.uefa.com/running-competitions/integrity/financial-sustainability/',texto:'Financial sustainability na UEFA'},
  };
  let hr='<div class="card" style="margin-top:16px"><h3>Referências normativas de custo de elenco</h3>'
    +'<p class="sub">As três regras usadas na página de indicadores. Cada uma define o próprio numerador, por isso os percentuais não são comparáveis entre si</p>'
    +'<div class="tw"><table class="t"><thead><tr><th>Referência</th><th>Teto</th><th>O que entra na conta</th><th>Base de receita</th><th>Aplicação</th><th>Fonte</th></tr></thead><tbody>';
  Object.keys(REFS).forEach(kk=>{
    const r=REFS[kk], l=LINKS[kk];
    hr+=`<tr><td><strong>${esc(r.titulo)}</strong></td>`
      +`<td>${esc(r.rotulo)}${r.rotuloExtra?'<br><span style="color:var(--muted)">'+esc(r.rotuloExtra)+'</span>':''}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:190px">${esc(r.metrica)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:130px">${esc(r.base)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:230px">${esc(r.vigor)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:150px"><a href="${l.url}" target="_blank" rel="noopener">${esc(l.texto)}</a></td></tr>`;
  });
  hr+='</tbody></table></div>'
    +'<p class="sub" style="margin:12px 0 0">O limite de dívida de curto prazo em 45% da receita, cobrado até 2030, também vem do regulamento da CBF. As demais faixas do painel de indicadores são convenção de leitura adotada aqui, sem respaldo normativo.</p></div>';
  w.appendChild(node(hr));
  const NOMES={receitaBruta:'Receita bruta com futebol',custosOperacionais:'Custos operacionais',outrosCustos:'Outros custos e despesas',perfilDivida:'Perfil da dívida',composicaoDivida:'Composição da dívida',circulante:'Circulante e não circulante',detalheDireitos:'Direitos de transmissão (detalhe)',direitosTransmissao:'Direitos de transmissão por campeonato',receitaFinanceira:'Receitas financeiras',despesaFinanceira:'Despesas financeiras',saf:'Plano de aportes da SAF',publico:'Público',socios:'Sócios',resumo:'Resumo das demonstrações',transferencias:'Transferências (receita)',custosTransferencia:'Investimento em elenco',obrigacoesExterior:'Obrigações com credores no exterior',aporte:'Aportes da proposta',custosArena:'Custos de arena',bilheteria:'Renda de jogos por competição'};
  w.appendChild(node(`<div class="card" style="margin-top:16px"><h3>Conjuntos de dados</h3><p class="sub">Séries que alimentam as análises deste painel</p>`
    +'<div class="tw"><table class="t"><thead><tr><th>Conjunto</th><th>Registros</th><th>Período</th></tr></thead><tbody>'
    +Object.entries(DATA).filter(([,v])=>Array.isArray(v)&&v.length).map(([k,v])=>{const y=v.map(r=>r.ano).filter(x=>x!=null);const p=y.length?Math.min(...y)+' a '+Math.max(...y):SEM_VALOR;return `<tr><td>${esc(NOMES[k]||k)}</td><td class="n">${fmt(v.length)}</td><td>${p}</td></tr>`;}).join('')
    +`<tr><td>Demonstrações contábeis auditadas</td><td class="n">${fmt(Object.keys(DATA.df.balanco).reduce((s,g)=>s+Object.keys(DATA.df.balanco[g]).length,0)*DATA.df.anos.length)}</td><td>${DATA.df.anos[0]} a ${DATA.df.anos[DATA.df.anos.length-1]}</td></tr>`
    +'</tbody></table></div></div>'));
  w.appendChild(node(`<div class="card prose" style="margin-top:16px">
    <p>Painel desenvolvido como ferramenta de análise financeira aplicada ao futebol, com foco em transparência, comparabilidade e suporte à tomada de decisão.</p>
    <p><strong>Victor Belchior</strong><br>victorbelchior25@gmail.com</p>
    <p class="sub">Aplicação web autocontida: todos os dados e gráficos estão neste próprio arquivo, sem dependências externas, e funcionam também sem conexão.</p></div>`));
}},
];

/* =========================================================
   Navegação, filtros, tema
   ========================================================= */
const VISIVEIS=PAGES.filter(p=>!p.oculta);
let CUR='inicio';
const wrap=document.getElementById('wrap');
const BODY=document.body;
function fecharPaineis(){BODY.classList.remove('nav-open','filt-open');}

function go(id){
  if(!VISIVEIS.some(p=>p.id===id))id='inicio';
  CUR=id;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  document.getElementById('crumb').textContent=(PAGES.find(p=>p.id===id)||{}).nome||'';
  wrap.innerHTML='';
  const page=PAGES.find(p=>p.id===id);
  const el=document.createElement('div');el.className='page on';
  wrap.appendChild(el);
  page.render(el);
  fecharPaineis();
  tipHide();
  markScrollables(el);
  window.scrollTo({top:0,behavior:'instant'});
}
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=VISIVEIS.map(p=>`<a href="#${p.id}" data-id="${p.id}"><i></i>${esc(p.nome)}</a>`).join('');
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.id);}));
}
function buildFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='<span class="lbl">Ano</span>'+ANOS.map(y=>`<button class="chip${YEARS.has(y)?' on':''}" data-y="${y}">${y}</button>`).join('')
    +'<button class="chip ghost" data-y="all">Todos</button>'
    +'<button class="chip apply" data-y="ok">Concluir</button>';
  f.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const y=b.dataset.y;
    if(y==='ok'){fecharPaineis();return;}
    if(y==='all')YEARS=new Set(ANOS);
    else{const n=+y;if(YEARS.has(n)&&YEARS.size>1)YEARS.delete(n);else YEARS.add(n);}
    const aberto=BODY.classList.contains('filt-open');
    buildFilters();go(CUR);
    if(aberto)BODY.classList.add('filt-open'); /* no celular o painel continua aberto para vários toques */
  }));
  document.getElementById('filtN').textContent=YEARS.size;
}

/* no desktop o filtro vive na barra superior; no celular, num painel inferior */
const FILT=document.getElementById('filters'),SLOT=document.getElementById('filtSlot'),APP=document.querySelector('.app');
function aplicarModo(){
  const alvo=isMob()?APP:SLOT;
  if(FILT.parentElement!==alvo)alvo.appendChild(FILT);
}

/* menu deslizante e painel de anos (celular) */
document.getElementById('menuBtn').addEventListener('click',()=>{
  const aberto=BODY.classList.contains('nav-open');fecharPaineis();if(!aberto)BODY.classList.add('nav-open');
});
document.getElementById('filtBtn').addEventListener('click',()=>{
  const aberto=BODY.classList.contains('filt-open');fecharPaineis();if(!aberto)BODY.classList.add('filt-open');
});
document.getElementById('scrim').addEventListener('click',fecharPaineis);
document.getElementById('sideClose').addEventListener('click',fecharPaineis);
addEventListener('keydown',e=>{if(e.key==='Escape')fecharPaineis();});

document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  go(CUR);
});

/* ao girar o aparelho ou redimensionar, redesenha só quando o modo muda */
let MOD=isMob(),_rt;
addEventListener('resize',()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const m=isMob();
    if(m!==MOD){MOD=m;aplicarModo();go(CUR);}
    else markScrollables();
  },200);
});

aplicarModo();buildNav();buildFilters();
go(location.hash?location.hash.slice(1):'inicio');

</script>
