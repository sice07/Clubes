:root{

  --ink:#141310; --ink-2:#52514E; --muted:#8A8880;

}
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --grena:#E23A4F; --grena-deep:#8E1424; --verde:#4A4A4A; --verde-deep:#0E0E0E;

  --s1:#E23A4F; --s2:#D4D4D4; --s3:#c98500; --s4:#3987e5; --s5:#d95926; --s6:#9085e9; --s7:#2a9d8f;
  --pos:#2ea36f; --neg:#e06b5e;
  --ok:#0ca30c; --warn:#fab219; --warn-ink:#e0a93c; --bad:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}}

  --grena:#E23A4F; --grena-deep:#8E1424; --verde:#4A4A4A; --verde-deep:#0E0E0E;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(170deg,var(--grena-deep) 0%, #2A0B10 48%, var(--verde-deep) 100%);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 16px}
.brand img{width:40px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.brand b{display:block;font-size:14px;letter-spacing:.02em}
.brand span{display:block;font-size:11px;opacity:.72;letter-spacing:.06em;text-transform:uppercase}
.navgrp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin:16px 8px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:rgba(255,255,255,.80);text-decoration:none;font-size:13px;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 #fff}
.nav a i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.sidefoot{margin-top:22px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.14);font-size:11px;opacity:.6;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--plane) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar .tt{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.filters{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.filters .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);transition:all .14s}
.chip:hover{border-color:var(--grena);color:var(--ink)}
.chip.on{background:var(--grena);border-color:var(--grena);color:#fff;font-weight:600}
.chip.ghost{border-style:dashed}
.wrap{padding:22px 24px 56px;max-width:1680px;width:100%}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

h1.ph{font-size:23px;margin:0 0 3px;letter-spacing:-.01em}
p.psub{margin:0 0 18px;color:var(--ink-2);font-size:13.5px}

.grid{display:grid;gap:16px;align-items:stretch}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.g32{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.pilha{display:flex;flex-direction:column;gap:16px;min-width:0}
.pilha>.card:last-child{flex:1 1 auto}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 2px;font-size:14px;font-weight:650;letter-spacing:.01em}
.card .sub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.card .sub.nb{margin-bottom:0}
.card.prose{justify-content:center}
.prose h4{margin:15px 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grena)}
.prose h4:first-child{margin-top:0}
.prose .fig{color:var(--ink);font-weight:660;font-variant-numeric:tabular-nums;white-space:nowrap}
.destaques{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin:0 0 15px;padding:0 0 15px;border-bottom:1px solid var(--grid)}
.destaques b{display:block;font-size:20px;font-weight:660;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.destaques span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;line-height:1.35;margin-top:4px}
.prose p{margin:0 0 10px;color:var(--ink-2);font-size:13.2px;line-height:1.62}
.prose p:last-child{margin-bottom:0}
.prose strong{color:var(--ink)}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--grena))}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.kpi .v{font-size:27px;font-weight:660;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.kpi .d{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.kpi .d b{font-variant-numeric:tabular-nums}
.up{color:var(--pos)} .down{color:var(--neg)}

/* ---------- Tables ---------- */
.tw{overflow:auto;max-height:900px;border-radius:10px;border:1px solid var(--border)}
.card>.tw{flex:1 1 auto;min-height:0}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.2px}
table.t th,table.t td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal;min-width:120px;max-width:260px}
table.t thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--axis)}
table.t td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.t tbody tr:hover td{background:color-mix(in srgb, var(--grena) 6%, var(--surface))}
table.t tr.grp td{background:color-mix(in srgb, var(--grena) 8%, var(--surface));font-weight:650;color:var(--ink)}
/* primeira coluna congelada: a descrição fica visível enquanto os anos rolam */
table.t th:first-child,table.t td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.t thead th:first-child{background:var(--surface-2);z-index:4}
table.t tr.tot td:first-child{z-index:3}
.tw.scrollable table.t th:first-child,.tw.scrollable table.t td:first-child{box-shadow:9px 0 10px -9px rgba(0,0,0,.30)}
table.t tr.sub2 td:first-child{padding-left:22px;color:var(--ink-2)}
table.t tr.tot td{background:var(--surface-2);font-weight:700;color:var(--ink);border-top:1px solid var(--axis);position:sticky;bottom:0;z-index:2}
table.t td.n{color:var(--ink)}
table.t a{color:var(--grena);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--grena) 40%, transparent)}
table.t a:hover{border-bottom-color:var(--grena)}
table.t .neg{color:var(--neg)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:50%;transform:translateY(-50%);height:60%;background:color-mix(in srgb, var(--s1) 22%, transparent);border-radius:3px;z-index:0}
.bar-cell span{position:relative;z-index:1}

/* DRE */
table.dre td,table.dre th{font-size:12.8px}
table.dre td:first-child,table.dre th:first-child{min-width:230px}
table.dre tr.hl td{background:color-mix(in srgb, var(--verde) 9%, var(--surface));font-weight:680;color:var(--ink)}
table.dre tr.sub td:first-child{padding-left:22px;color:var(--muted)}

/* ---------- Chart chrome ---------- */
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.chead .tx{min-width:0}
.tgl{margin-left:auto;flex:none;border:1px solid var(--border-2);background:transparent;border-radius:8px;padding:3px 9px;font-size:11px;color:var(--muted)}
.tgl:hover{color:var(--ink);border-color:var(--grena)}
.tgl.on{background:var(--grena);border-color:var(--grena);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.legend .li{display:flex;align-items:center;gap:6px;cursor:default}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .sw.ln{height:3px;border-radius:2px;width:14px}
/* o gráfico e sua legenda formam um bloco que se centraliza na sobra do cartão,
   em vez de esticar e deixar uma faixa vazia embaixo */
.viz{margin-block:auto;min-width:0}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart.fixa{max-width:560px;margin-inline:auto}
svg.chart text{font-family:var(--sans)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);padding:9px 11px;font-size:12px;color:var(--ink);opacity:0;transition:opacity .1s;max-width:290px}
.tip.on{opacity:1}
.tip .tt{font-weight:660;margin-bottom:5px;font-size:12px}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:2px;white-space:nowrap}
.tip .row .sw{width:9px;height:9px;border-radius:2px;flex:none}
.tip .row .nm{color:var(--ink-2);margin-right:auto;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tip .row .vl{font-variant-numeric:tabular-nums;font-weight:620}
.tableview{display:none;margin-top:12px}
.tableview.on{display:block}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:18px;overflow:hidden;padding:38px 36px;background:linear-gradient(115deg,var(--grena-deep) 0%, #2A0B10 45%, var(--verde-deep) 100%);color:#fff;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(900px 340px at 82% 12%, rgba(255,255,255,.14), transparent 62%)}
.hero .in{position:relative;z-index:1;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.hero img{width:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.hero h1{margin:0;font-size:31px;letter-spacing:-.02em;line-height:1.12}
.hero p{margin:7px 0 0;opacity:.82;font-size:14px;max-width:640px}
.hero .tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .tags span{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 11px;font-size:11.5px;background:rgba(255,255,255,.08)}
.navcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .16s, border-color .16s;display:block;width:100%}
.navcard:hover{transform:translateY(-2px);border-color:var(--grena)}
.navcard b{display:block;font-size:13.5px;margin-bottom:3px}
.navcard span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block}
.navcard em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grena);font-weight:700;display:block;margin-bottom:6px}

.selo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.selo.ok{color:#0a7a0a} .selo.at{color:var(--warn-ink)} .selo.ruim{color:var(--bad)}
:root[data-theme="dark"] .selo.ok{color:#2fbf2f}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .selo.ok{color:#2fbf2f}}
.refsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.refsel .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{border-left:3px solid var(--s3);background:color-mix(in srgb, var(--s3) 9%, transparent);padding:10px 13px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--ink-2)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* ---------- Controles que só aparecem no celular ---------- */
.iconbtn{display:none;align-items:center;justify-content:center;gap:7px;min-width:42px;height:42px;padding:0 13px;border:1px solid var(--border-2);background:var(--surface);border-radius:12px;color:var(--ink-2);font-size:14px;line-height:1}
.iconbtn:hover{border-color:var(--grena);color:var(--ink)}
.iconbtn b{font-weight:650;font-variant-numeric:tabular-nums}
.scrim{display:none}
.sideclose{display:none}
.filters .apply{display:none}
.filtslot{display:contents}

@media(max-width:1180px){
  .g2,.g23,.g32{grid-template-columns:1fr}
  .g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- Celular e tablet em retrato ---------- */
@media(max-width:860px){
  html{-webkit-tap-highlight-color:transparent}
  body{font-size:15px}
  button{touch-action:manipulation}
  .app{grid-template-columns:1fr}
  .iconbtn{display:inline-flex}
  .only-d{display:none}

  .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s}
  body.nav-open .scrim,body.filt-open .scrim{opacity:1;pointer-events:auto}
  body.nav-open,body.filt-open{overflow:hidden}

  /* menu lateral deslizante */
  .side{position:fixed;inset:0 auto 0 0;width:min(84vw,310px);height:100dvh;z-index:60;transform:translateX(-103%);
        transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:0 0 50px rgba(0,0,0,.45);
        padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
  body.nav-open .side{transform:none}
  .sideclose{display:flex;position:absolute;top:calc(16px + env(safe-area-inset-top));right:12px;width:36px;height:36px;
             align-items:center;justify-content:center;border-radius:11px;border:1px solid rgba(255,255,255,.26);
             background:rgba(255,255,255,.10);color:#fff;font-size:18px;line-height:1}
  .nav{display:block}
  .nav a{padding:12px;font-size:14.5px;border-radius:11px}

  .topbar{padding:calc(9px + env(safe-area-inset-top)) 12px 9px;gap:9px}
  .topbar .tt{flex:1;min-width:0;font-size:13.5px;font-weight:650;color:var(--ink);text-transform:none;letter-spacing:0;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #themeBtn{height:42px;min-width:42px;border-radius:12px;padding:0 13px;font-size:16px;display:inline-flex;align-items:center;justify-content:center}

  /* filtro de anos em painel inferior */
  .filters{position:fixed;left:0;right:0;bottom:0;z-index:61;margin-left:0;background:var(--surface);
           border-top:1px solid var(--border-2);border-radius:20px 20px 0 0;
           padding:20px 16px calc(18px + env(safe-area-inset-bottom));
           display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
           transform:translateY(103%);transition:transform .26s cubic-bezier(.4,0,.2,1);
           box-shadow:0 -12px 40px rgba(0,0,0,.28)}
  body.filt-open .filters{transform:none}
  .filters:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:99px;background:var(--border-2)}
  .filters .lbl{grid-column:1/-1;font-size:12px;margin:0}
  .filters .chip{height:46px;font-size:14.5px;display:flex;align-items:center;justify-content:center;border-radius:12px}
  .filters .apply{display:flex;grid-column:1/-1;background:var(--verde);border-color:var(--verde);color:#fff;font-weight:650}

  .wrap{padding:14px 12px 40px}
  .card{padding:14px 13px;border-radius:12px}
  h1.ph{font-size:20px}
  p.psub{font-size:12.8px;margin-bottom:14px}
  .hero{padding:22px 18px;border-radius:14px}
  .hero .in{gap:16px}
  .hero img{width:64px}
  .hero h1{font-size:22px}
  .hero p{font-size:13px}
  .kpi{padding:13px 14px}
  .kpi .v{font-size:22px}
  .kpi .k{font-size:10px}
  .tw{max-height:72vh}
  table.t{font-size:12.6px}
  table.t th,table.t td{padding:9px 10px}
  table.t th:first-child,table.t td:first-child{min-width:112px;max-width:170px}
  table.dre td:first-child,table.dre th:first-child{min-width:150px}
  .tgl{height:34px;padding:0 12px;font-size:12px}
  .legend{font-size:12.5px;gap:7px 14px}
  .tip{font-size:13.5px;max-width:min(80vw,310px);padding:11px 13px}
  .tip .row .nm{max-width:150px}
  .foot{flex-direction:column;gap:5px}
}
@media(max-width:430px){
  .g3,.g5{grid-template-columns:1fr}
  .hero .tags span{font-size:11px}
}
/* tablet em paisagem: menu fixo mais estreito */
@media(min-width:861px) and (max-width:1100px){
  .app{grid-template-columns:210px 1fr}
  .nav a{font-size:12.5px;padding:7px 9px}
}
/* ---------- Relatório ---------- */
.relbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.relbar .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.relbar .obs{flex:1 0 100%;font-size:11.5px;color:var(--muted)}
.btn-print{margin-left:auto;border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:12.5px;color:var(--ink-2)}
.btn-print:hover{border-color:var(--grena);color:var(--ink)}
.folha{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 30px;margin-bottom:16px}
.folha+.folha{margin-top:0}
.folha h2{margin:0 0 3px;font-size:19px;letter-spacing:-.01em}
.folha .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grena);font-weight:700;margin:0 0 10px}
.folha p{margin:0 0 11px;font-size:13.4px;line-height:1.62;color:var(--ink-2)}
.folha p:last-child{margin-bottom:0}
.folha strong{color:var(--ink)}
.folha h3{margin:20px 0 8px;font-size:14px}
.folha h3:first-of-type{margin-top:14px}
.capa{display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--grid);padding-bottom:20px;margin-bottom:20px}
.capa img{width:64px;flex:none}
.capa h1{margin:0;font-size:25px;letter-spacing:-.02em;line-height:1.15}
.capa .meta{margin-top:6px;font-size:12.5px;color:var(--muted)}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
/* cenário: deliberadamente diferente de um card comum, para o leitor não
   confundir estimativa com número das demonstrações */
.ressalva{margin:0 0 8px;padding:9px 11px;border-left:3px solid var(--warn);
  background:color-mix(in srgb, var(--warn) 6%, var(--surface));border-radius:0 8px 8px 0;
  font-size:11.8px;line-height:1.5;color:var(--ink-2)}
.cenario{margin-top:16px;padding:22px 24px;border-radius:var(--r);
  border:1px dashed var(--warn);background:color-mix(in srgb, var(--warn) 7%, var(--surface))}
.cenario .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--warn-ink);border:1px solid var(--warn);
  border-radius:999px;padding:3px 10px;margin-bottom:10px}
.cenario h3{margin:0 0 10px;font-size:15.5px;letter-spacing:-.01em}
.cenario p{margin:0 0 10px;font-size:13.4px;line-height:1.62;color:var(--ink-2)}
.cenario strong{color:var(--ink)}
.cenario .fonte{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--grid);
  font-size:11.8px;line-height:1.55;color:var(--muted)}
@media print{.cenario{border-style:solid;border-color:#bbb;background:#fafafa;break-inside:avoid}
  .cenario p{font-size:10.6px;line-height:1.46}
  .cenario .fonte{font-size:9.4px}}
@media(max-width:860px){.swot{grid-template-columns:1fr}
  .capa{flex-direction:column;align-items:flex-start;gap:14px}
  .capa h1{font-size:21px}
  .folha{padding:20px 18px}
  .btn-print{margin-left:0}}
.swot .q{border:1px solid var(--border);border-top-width:3px;border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.swot .q h4{margin:0 0 9px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.swot .q ul{margin:0;padding-left:17px}
.swot .q li{margin:0 0 8px;font-size:12.7px;line-height:1.52;color:var(--ink-2)}
.swot .q li:last-child{margin-bottom:0}
.swot .q li b{color:var(--ink);font-variant-numeric:tabular-nums}
.swot .qf{border-top-color:var(--s2)} .swot .qf h4{color:var(--s2)}
.swot .qw{border-top-color:var(--s1)} .swot .qw h4{color:var(--s1)}
.swot .qo{border-top-color:var(--s4)} .swot .qo h4{color:var(--s4)}
.swot .qt{border-top-color:var(--s5)} .swot .qt h4{color:var(--s5)}
.riscos{display:grid;gap:10px;margin-top:4px}
.risco{border:1px solid var(--border);border-left:3px solid var(--sev,var(--muted));border-radius:10px;padding:11px 14px;background:var(--surface-2)}
.risco .rt{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:5px}
.risco .rt b{font-size:13px;color:var(--ink)}
.risco p{margin:0;font-size:12.3px;color:var(--ink-2);line-height:1.5}
.risco .ev{margin-top:5px;font-size:11.6px;color:var(--muted);font-variant-numeric:tabular-nums}
.aviso{border:1px solid var(--border-2);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:16px}

@media print{
  @page{size:A4;margin:13mm}
  .side,.topbar,.scrim,.filters,.tgl,.relbar,.btn-print,.tip{display:none!important}
  .app{display:block}
  .wrap{padding:0;max-width:none}
  body{background:#fff;font-size:11.5px}
  .folha{break-after:page;box-shadow:none;border:none;border-radius:0;padding:0 0 10px;margin:0}
  .folha:last-of-type{break-after:auto}
  .folha h2{font-size:16px}
  .folha p{font-size:11.2px;line-height:1.5}
  .swot .q,.card{break-inside:avoid}
  table.t{font-size:9.6px}
  table.t th,table.t td{padding:4px 6px}
  .tw{max-height:none;overflow:visible;border-color:#ddd}
  .swot .q li{font-size:10.2px;line-height:1.42;margin-bottom:5px}
  .swot .q{padding:10px 12px}
  .swot{gap:9px}
  .riscos{grid-template-columns:1fr 1fr;gap:7px}
  .risco{padding:7px 9px;break-inside:avoid}
  .risco p{font-size:9.5px;line-height:1.38}
  .risco .ev{font-size:8.8px;margin-top:3px}
  .risco .rt b{font-size:10.4px}
  .risco .rt{margin-bottom:3px}
  .selo{font-size:8.5px;padding:1px 6px}
  .folha h3{font-size:12px;margin:12px 0 6px}
  .destaques b{font-size:15px}
  .kpi .v{font-size:19px}
  .kpi{padding:9px 11px}
  .capa img{width:46px}
  .capa h1{font-size:19px}
  .capa{padding-bottom:12px;margin-bottom:12px}
  .aviso{font-size:9.6px;padding:8px 10px}
}
@media print{.page{display:block!important}}

/* link de volta para o hub do site */
.volta-hub{display:inline-flex;align-items:center;gap:7px;margin:2px 6px 2px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24)}
.volta-hub:hover{background:rgba(255,255,255,.22)}
</style>

<script>
/* =========================================================
   Núcleo: formatação, filtros e indicadores financeiros
   ========================================================= */
const S=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];
const sc=i=>S[i%S.length];
const ANOS=[2020,2021,2022,2023,2024,2025];
let YEARS=new Set(ANOS);

const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SEM_VALOR='-';
const fmt=v=>(v==null||isNaN(v))?SEM_VALOR:nf0.format(Math.round(v));
const fmtS=v=>{if(v==null||isNaN(v))return SEM_VALOR;const a=Math.abs(v);if(a>=1e6)return nf1.format(v/1e6)+'M';if(a>=1e3)return nf0.format(v/1e3)+'k';if(a<10&&!Number.isInteger(v))return nf2.format(v);return nf0.format(v);};
const pct=v=>(v==null||!isFinite(v))?SEM_VALOR:nf1.format(v*100)+'%';
/* Cobertura: um índice como 0,37 diz pouco ao leitor. Lido como 37% do passivo
   circulante, o mesmo número é imediato. O equilíbrio contábil fica em 100%. */
const cob=v=>(v==null||!isFinite(v))?SEM_VALOR:nf0.format(Math.round(v*100))+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const inY=r=>YEARS.has(r.ano);
const sum=(rows,f)=>rows.reduce((a,r)=>a+((f?f(r):true)?(+r.valor||0):0),0);
const anosSel=()=>ANOS.filter(a=>YEARS.has(a));

const CLUBE={nome:'Flamengo',oficial:'Clube de Regatas do Flamengo'};
const EXTRA=new Set(["Transferências de atletas e mecanismo de solidariedade","Receitas Extraordinárias"]);
/* receita operacional é tudo o que não é transferência nem extraordinário */
const OPER=new Set(DATA.receitaBruta.map(r=>r.linha).filter(l=>!EXTRA.has(l)));

/* Indicadores por ano (a=null → soma dos anos selecionados) */
const yOk=(r,a)=>a==null?inY(r):r.ano===a;
const M={
  receitaOperacional:a=>sum(DATA.receitaBruta.filter(r=>yOk(r,a)&&OPER.has(r.linha))),
  receitaExtra:a=>sum(DATA.receitaBruta.filter(r=>yOk(r,a)&&EXTRA.has(r.linha))),
  receitaBruta:a=>sum(DATA.receitaBruta.filter(r=>yOk(r,a))),
  direitoArena:a=>sum(DATA.custosOperacionais.filter(r=>yOk(r,a)&&r.categoria==='Direito de arena')),
  /* exclui impostos sobre o direito de arena e o próprio direito de arena;
     a comparação ignora maiúsculas porque a base grafa "Direito de arena" */
  custosOperacionais:a=>sum(DATA.custosOperacionais.filter(r=>{
    const t=(r.tipo||'').toLowerCase();
    return yOk(r,a)&&t!=='impostos e contribuições'&&t!=='direito de arena';
  })),
  custosTotais:a=>sum(DATA.custosOperacionais.filter(r=>yOk(r,a))),
  depreciacao:a=>sum(DATA.outrosCustos.filter(r=>yOk(r,a))),
  receitaFinanceira:a=>sum(DATA.receitaFinanceira.filter(r=>yOk(r,a))),
  despesaFinanceira:a=>DATA.despesaFinanceira.filter(r=>yOk(r,a)).reduce((s,r)=>s+(+r.valorPos||0),0),
  publico:a=>sum((DATA.publico||[]).filter(r=>yOk(r,a))),
  socios:a=>sum((DATA.socios||[]).filter(r=>yOk(r,a))),
  receitaSocio:a=>sum(DATA.receitaBruta.filter(r=>yOk(r,a)&&r.linha==='Programa sócio-torcedor')),
  divida:a=>sum(DATA.perfilDivida.filter(r=>yOk(r,a))),
};
M.receitaLiquida=a=>M.receitaOperacional(a)-M.direitoArena(a);
M.ebitda=a=>M.receitaLiquida(a)-M.custosOperacionais(a);
M.ebitdaTotal=a=>M.ebitda(a)+M.receitaExtra(a);
M.ebit=a=>M.ebitdaTotal(a)-M.depreciacao(a);
M.financeiro=a=>M.receitaFinanceira(a)-M.despesaFinanceira(a);
M.resultado=a=>M.ebit(a)+M.receitaFinanceira(a)-M.despesaFinanceira(a);
M.socioPorPublico=a=>{const s=M.socios(a);return s?M.publico(a)/s:null;};
M.ticketMedio=a=>{const s=M.socios(a);return s?(M.receitaSocio(a)*100)/s:null;};
const APORTE_TOTAL=(DATA.saf||[]).reduce((s,r)=>s+(+r.valor||0),0);
M.valorAportado=()=>APORTE_TOTAL/11;
M.potencialSAF=a=>M.valorAportado()+M.receitaOperacional(a);
M.ebitdaSAF=a=>M.potencialSAF(a)-M.custosOperacionais(a);

/* =========================================================
   Balanço, fluxo de caixa e indicadores (demonstrações auditadas)
   ========================================================= */
const B={
  /* totais publicados do balanço */
  t:(chave,a)=>+(DATA.df.totais[chave]||{})[String(a)]||0,
  /* uma conta específica dentro de um grupo do balanço */
  b:(grupo,conta,a)=>+((DATA.df.balanco[grupo]||{})[conta]||{})[String(a)]||0,
  /* linha do fluxo de caixa */
  f:(chave,a)=>+(DATA.df.fluxo[chave]||{})[String(a)]||0,
  /* linha da DRE oficial */
  dre:(chave,a)=>+(DATA.df.dreOficial[chave]||{})[String(a)]||0,
};
B.pl=a=>B.t('patrimonioLiquido',a);
B.liquidezCorrente=a=>{const pc=B.t('passivoCirculante',a);return pc?B.t('ativoCirculante',a)/pc:0;};
B.capitalCirculante=a=>B.t('ativoCirculante',a)-B.t('passivoCirculante',a);
B.dividaBruta=a=>B.b('passivoCirculante','Empréstimos e financiamentos',a)+B.b('passivoNaoCirculante','Empréstimos e financiamentos (LP)',a);
B.dividaLiquida=a=>B.dividaBruta(a)-B.b('ativoCirculante','Caixa e equivalentes',a);
B.tributosTotais=a=>B.b('passivoCirculante','Tributos parcelados',a)+B.b('passivoNaoCirculante','Tributos parcelados (LP)',a);
/* indicadores que cruzam o balanço com as séries de receita e custo */
B.folha=a=>sum(DATA.custosOperacionais.filter(r=>yOk(r,a)&&(r.categoria||'').indexOf('Salários')===0));
B.receitaTotal=a=>M.receitaOperacional(a)+M.receitaExtra(a);
B.wageRatio=a=>{const r=M.receitaOperacional(a);return r?B.folha(a)/r:0;};
B.dependencia=a=>{const r=B.receitaTotal(a);return r?M.receitaExtra(a)/r:0;};
B.margemEbitdaTotal=a=>{const r=B.receitaTotal(a);return r?M.ebitdaTotal(a)/r:0;};
B.passivoSobreReceita=a=>{const r=B.receitaTotal(a);return r?B.t('passivoTotal',a)/r:0;};
B.amortElenco=a=>sum(DATA.outrosCustos.filter(r=>yOk(r,a)&&(r.linha||'').indexOf('Amortiza')===0));
B.comissoes=a=>sum(DATA.custosOperacionais.filter(r=>yOk(r,a)&&(r.tipo||'').indexOf('Comissão')===0));
/* A norma da CBF mede a dívida de curto prazo LÍQUIDA: obrigações que vencem em
   doze meses menos caixa. Medir pelo passivo circulante cheio superestima o índice
   e chega a inverter o veredito. */
B.dividaCurtoLiquida=a=>B.t('passivoCirculante',a)-B.b('ativoCirculante','Caixa e equivalentes',a);
B.dividaCurtoSobreReceita=a=>{const r=B.receitaTotal(a);return r?B.dividaCurtoLiquida(a)/r:0;};
/* Base do PROFUT: a lei fala em receita bruta das ATIVIDADES DO FUTEBOL PROFISSIONAL,
   então o clube social e as modalidades amadoras ficam de fora. */
B.receitaFutebol=a=>B.receitaTotal(a)-sum(DATA.receitaBruta.filter(r=>yOk(r,a)&&r.linha==='Clube Social e Esportes Amadores'));

/* =========================================================
   Referências normativas de custo de elenco
   Cada regra define o próprio numerador, por isso a razão muda junto
   com a referência escolhida.
   ========================================================= */
const REFS={
  profut:{
    nome:'PROFUT', titulo:'PROFUT, Lei 13.155/2015',
    limite:80, rotulo:'80%',
    metrica:'Salários, encargos, benefícios e direitos de imagem',
    base:'Receita bruta das atividades do futebol profissional',
    calc:a=>{const r=B.receitaFutebol(a);return r?B.folha(a)/r:0;},
    regra:'O art. 4º, inciso IX, condiciona a permanência no programa a gasto com folha de pagamento e direitos de imagem <strong>de atletas profissionais de futebol</strong> de no máximo 80% da receita bruta anual <strong>das atividades do futebol profissional</strong>. A lei não define a composição dessa receita: o parágrafo 6º apenas lista as rubricas que as demonstrações devem evidenciar.',
    aprox:'O painel usa a receita total menos clube social e esportes amadores como aproximação da receita do futebol profissional, e a folha publicada na demonstração, que não separa atletas de comissão técnica e administrativo. O índice real tende a ser menor que o mostrado aqui.',
    vigor:'Em vigor. O clube integra o programa desde 2015 e carregava R$ 120.095 mil de PROFUT e R$ 42.221 mil reparcelados pela Lei 14.148 no balanço de 2025.',
    fonte:'Lei 13.155/2015, art. 4º, IX'
  },
  cbf:{
    nome:'CBF', titulo:'Fair Play Financeiro da CBF',
    limite:70, rotulo:'70% em 2029',
    limiteExtra:80, rotuloExtra:'80% em 2028',
    metrica:'Salários, encargos, direitos de imagem, bônus e luvas de atletas e do treinador principal, mais amortização de direitos e comissões de agentes',
    base:'Capacidade de receita',
    calc:a=>{const r=B.receitaTotal(a);return r?(B.folha(a)+B.amortElenco(a))/r:0;},
    regra:'O Sistema de Sustentabilidade Financeira, fiscalizado pela ANRESF, limita o custo de elenco a um percentual da capacidade de receita do clube. Pelo exercício apurado, o teto é de 90% em 2026, 80% em 2027 e 70% a partir de 2028 na Série A, e de 80% em caráter permanente na Série B. Como cada exercício é apurado no ano seguinte, a imprensa noticiou o mesmo calendário como 80% em 2028 e 70% em 2029. Há ainda um indicador de dívida líquida de curto prazo, que cai de 70% da receita relevante em 2026 para 45% a partir do exercício de 2029.',
    aprox:'A capacidade de receita definida pela norma soma receita operacional, aportes de capital dos controladores e o resultado líquido médio de transferências de três anos. O painel usa a receita total do exercício, que é o que as demonstrações permitem reconstruir, e por isso o índice aqui é aproximado.',
    vigor:'Vigente desde janeiro de 2026, com 2026 e 2027 em fase de transição e cobrança plena a partir de 2028, sobre o exercício de 2027.',
    fonte:'Regulamento do Sistema de Sustentabilidade Financeira da CBF e da ANRESF',
    curtoPrazo:45
  },
  uefa:{
    nome:'UEFA', titulo:'Squad cost rule da UEFA',
    limite:70, rotulo:'70%',
    metrica:'Salários, encargos, bônus e direitos de imagem de atletas e do treinador principal, amortização dos direitos e comissões de agentes',
    base:'Receita operacional ajustada mais resultado líquido de transferências',
    calc:a=>{const r=B.receitaTotal(a);return r?(B.folha(a)+B.amortElenco(a)+B.comissoes(a))/r:0;},
    regra:'O art. 94 do Club Licensing and Financial Sustainability Regulations limita o custo de elenco a 70% da receita ajustada. As pessoas relevantes são os atletas e o treinador principal, e não a comissão técnica inteira.',
    aprox:'A receita ajustada da UEFA exclui receitas excepcionais e soma o resultado líquido de transferências. O painel usa a receita total do exercício, então o índice aqui é aproximado.',
    vigor:'Não se aplica ao Flamengo, que não disputa competições da UEFA. Vale para clubes das competições da UEFA, com escalonamento de 90% em 2023/24, 80% em 2024/25 e 70% a partir de 2025/26.',
    fonte:'UEFA Financial Sustainability Regulations'
  }
};
let REF_ATIVA='profut';

/* ------------------------------------------------------------------
   Cenário: Mundial de Clubes da FIFA de 2025

   O clube disputou o Mundial de Clubes de junho e julho de 2025 e caiu nas
   oitavas de final. A premiação entrou no exercício de 2025 e é, por natureza,
   não recorrente: no formato de 32 clubes o torneio só volta em 2029.

   As demonstrações não abrem a premiação por competição, mas publicam a linha
   "Participação, exposição e performance", que soma todas as premiações do ano.
   O valor do Mundial vem de noticiário e serve só para dimensionar o efeito.
   Nada aqui entra nas medidas do painel.
   ------------------------------------------------------------------ */
const MUNDIAL={
  ano:2025,
  usd:27.7,                       /* campanha até as oitavas, pela tabela da FIFA */
  bruta:152700,                   /* equivalente em R$ mil, conforme noticiado */
  fonte:'imprensa esportiva, aplicando a tabela de premiação por fase da FIFA à campanha do clube',
  linhaPremiacao:'Participação, exposição e performance',
};
const premiacaoAno=y=>sum(DATA.detalheDireitos.filter(r=>r.ano===y&&r.tipo===MUNDIAL.linhaPremiacao));
const semMundial=()=>{
  const y=MUNDIAL.ano, ant=y-1;
  const semPrem=M.receitaOperacional(y)-premiacaoAno(y), semPremAnt=M.receitaOperacional(ant)-premiacaoAno(ant);
  return {
    ebitdaSem:Math.round(M.ebitda(y)-MUNDIAL.bruta),
    receita:Math.round(M.receitaOperacional(y)-MUNDIAL.bruta),
    transmissao:Math.round(sum(DATA.detalheDireitos.filter(r=>r.ano===y))-MUNDIAL.bruta),
    receitaTotal:Math.round(B.receitaTotal(y)-MUNDIAL.bruta),
    semPrem, semPremAnt,
    cresceSemPrem:semPremAnt?semPrem/semPremAnt-1:0,
    premiacao:premiacaoAno(y),
    premiacaoAnt:premiacaoAno(ant),
  };
};
/* compara dois valores em palavras, para o texto não afirmar alta quando houve estabilidade */
const compara=(v,ref)=>{const d=ref?v/ref-1:0;return Math.abs(d)<0.03?'praticamente igual à':d>0?'acima da':'abaixo da';};

const refAtual=()=>REFS[REF_ATIVA];

/* selo de situação: a cor vem sempre acompanhada de ícone e texto */
B.selo=(estado,texto)=>{
  const m={ok:['✓','Dentro da referência'],at:['!','Atenção'],ruim:['▲','Fora da referência']};
  const [ic,pad]=m[estado]||m.at;
  return `<span class="selo ${estado}">${ic} ${esc(texto||pad)}</span>`;
};

/* agrupamentos utilitários */
function groupSum(rows,keyFn,valFn){const m=new Map();rows.forEach(r=>{const k=keyFn(r);m.set(k,(m.get(k)||0)+(valFn?valFn(r):(+r.valor||0)));});return m;}
function uniq(rows,keyFn){const s=[];const seen=new Set();rows.forEach(r=>{const k=keyFn(r);if(k!=null&&!seen.has(k)){seen.add(k);s.push(k);}});return s;}

/* =========================================================
   Motor de gráficos em SVG (sem dependências externas)
   ========================================================= */
/* Tela pequena: o painel troca de layout e os gráficos usam uma
   moldura mais estreita, o que aumenta o texto em proporção. */
const MOBQ=matchMedia('(max-width:860px)');
const isMob=()=>MOBQ.matches;

const TIP=document.getElementById('tip');
let TIP_TOUCH=false;
function tipShow(html,ev,touch){TIP.innerHTML=html;TIP.classList.add('on');TIP_TOUCH=!!touch;tipMove(ev,touch);}
function tipMove(ev,touch){
  const r=TIP.getBoundingClientRect();
  let x,y;
  if(touch){ x=ev.clientX-r.width/2; y=ev.clientY-r.height-22; if(y<8)y=ev.clientY+26; }
  else { x=ev.clientX+14; y=ev.clientY+14; if(y+r.height>innerHeight-8)y=ev.clientY-r.height-14; }
  x=Math.max(8,Math.min(x,innerWidth-r.width-8));
  y=Math.max(8,Math.min(y,innerHeight-r.height-8));
  TIP.style.left=x+'px';TIP.style.top=y+'px';
}
function tipHide(){TIP.classList.remove('on');TIP_TOUCH=false;}
/* Depois de um toque o navegador ainda dispara eventos de mouse por
   compatibilidade, inclusive o mouseleave de um elemento antigo, que apagaria
   a dica recém-aberta. Por isso os tratadores de mouse ficam inertes logo após
   um toque. */
let ULT_TOQUE=0;
const porToque=()=>Date.now()-ULT_TOQUE<800;
document.addEventListener('pointerdown',e=>{
  if(e.pointerType&&e.pointerType!=='mouse')ULT_TOQUE=Date.now();
  if(TIP_TOUCH&&!(e.target.closest&&e.target.closest('svg.chart')))tipHide();
},true);
addEventListener('scroll',()=>{if(TIP_TOUCH)tipHide();},true);
function tipRows(title,items){return '<div class="tt">'+esc(title)+'</div>'+items.map(i=>'<div class="row"><span class="sw" style="background:'+i.c+'"></span><span class="nm">'+esc(i.n)+'</span><span class="vl">'+i.v+'</span></div>').join('');}

function niceTicks(min,max,n){
  if(min===max){max=min+1;}
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag; let step=mag*(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10);
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const out=[]; for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
function roundedTop(x,y,w,h,r){ // retângulo com topo arredondado (extremidade de dado)
  r=Math.max(0,Math.min(r,w/2,Math.abs(h)));
  if(h<=0.6) return `M${x} ${y+h} h${w} v${-h} h${-w} Z`;
  return `M${x} ${y+h} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h} Z`;
}
function roundedRight(x,y,w,h,r){
  r=Math.max(0,Math.min(r,h/2,Math.abs(w)));
  if(w<=0.6) return `M${x} ${y} h${w} v${h} h${-w} Z`;
  return `M${x} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h} H${x} Z`;
}

/* Colunas e barras, agrupadas ou empilhadas */
function chartBars(o){
  const cats=o.cats, series=o.series, stacked=!!o.stacked, horiz=!!o.horizontal;
  const W=o.width||820, H=o.height||330;
  const ml=horiz?(o.labelW||150):62, mr=16+(o.refLabel?52:0), mt=14, mb=horiz?30:(o.rotate?58:32);
  const iw=W-ml-mr, ih=H-mt-mb;
  // domínio
  let lo=0,hi=0;
  cats.forEach((c,ci)=>{
    if(stacked){let p=0,n=0;series.forEach(s=>{const v=+s.data[ci]||0;if(v>=0)p+=v;else n+=v;});hi=Math.max(hi,p);lo=Math.min(lo,n);}
    else series.forEach(s=>{const v=+s.data[ci]||0;hi=Math.max(hi,v);lo=Math.min(lo,v);});
  });
  if(o.ref!=null){hi=Math.max(hi,o.ref);lo=Math.min(lo,o.ref);}
  if(hi===0&&lo===0)hi=1;
  const ticks=niceTicks(lo,hi,o.ticks||4), t0=ticks[0], t1=ticks[ticks.length-1];
  /* eixo em % também leva o símbolo, para o leitor não precisar deduzir a unidade */
  const eixo=t=>fmtS(t)+(o.unit==='%'?'%':'');
  const vpx=horiz?(v=>((v-t0)/(t1-t0))*iw):(v=>ih-((v-t0)/(t1-t0))*ih);
  const band=(horiz?ih:iw)/cats.length;
  const pad=Math.min(band*0.22,horiz?10:26);
  const inner=band-pad*2;
  const n=stacked?1:series.length;
  const bw=Math.max(2,(inner-(n-1)*3)/n);
  let g='';
  // grades
  ticks.forEach(t=>{
    if(horiz){const x=ml+vpx(t);g+=`<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+ih}" stroke="var(--grid)" stroke-width="1"/>`
      +`<text x="${x}" y="${mt+ih+18}" fill="var(--muted)" font-size="10.5" text-anchor="middle">${eixo(t)}</text>`;}
    else{const y=mt+vpx(t);g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`
      +`<text x="${ml-8}" y="${y+3.5}" fill="var(--muted)" font-size="10.5" text-anchor="end">${eixo(t)}</text>`;}
  });
  const zero=horiz?ml+vpx(0):mt+vpx(0);
  g+=horiz?`<line x1="${zero}" y1="${mt}" x2="${zero}" y2="${mt+ih}" stroke="var(--axis)" stroke-width="1.5"/>`
          :`<line x1="${ml}" y1="${zero}" x2="${ml+iw}" y2="${zero}" stroke="var(--axis)" stroke-width="1.5"/>`;
  /* linha de referência (ex.: teto de 70% para folha sobre receita) */
  if(o.ref!=null&&!horiz&&o.ref<=t1&&o.ref>=t0){
    const y=mt+vpx(o.ref);
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>`
      +`<text x="${ml+iw+7}" y="${y+3.5}" fill="var(--warn-ink)" font-size="10.5" font-weight="650">${esc(o.refLabel||'')}</text>`;
  }
  // marcas
  let marks='';
  cats.forEach((c,ci)=>{
    const b0=(horiz?mt:ml)+ci*band+pad;
    let accP=0,accN=0;
    series.forEach((s,si)=>{
      const v=+s.data[ci]||0; if(!v) return;
      const col=s.color||sc(si);
      const meta=`data-c="${esc(c)}" data-s="${esc(s.name)}" data-v="${v}" data-col="${col}"`;
      if(horiz){
        const y=b0+(stacked?0:si*(bw+3)), h=stacked?inner:bw;
        let x1,x2;
        if(stacked){ if(v>=0){x1=vpx(accP);accP+=v;x2=vpx(accP);} else {x2=vpx(accN);accN+=v;x1=vpx(accN);} }
        else { x1=vpx(Math.min(0,v)); x2=vpx(Math.max(0,v)); }
        let x=ml+x1, w=x2-x1;
        if(stacked&&w>3){ if(v>=0)w-=2; else {x+=2;w-=2;} }
        const isEnd=!stacked||si===series.length-1;
        marks+=`<path class="mk" d="${v>=0?roundedRight(x,y,w,h,isEnd?4:1):roundedRight(x,y,w,h,1)}" fill="${col}" ${meta}/>`;
      } else {
        const x=b0+(stacked?0:si*(bw+3)), w=stacked?inner:bw;
        let y1,y2;
        if(stacked){ if(v>=0){y1=vpx(accP);accP+=v;y2=vpx(accP);} else {y1=vpx(accN);accN+=v;y2=vpx(accN);} }
        else { y1=vpx(Math.max(0,v)); y2=vpx(Math.min(0,v)); }
        let y=mt+Math.min(y1,y2), h=Math.abs(y2-y1);
        if(stacked&&h>3){h-=2; if(v<0)y+=2;}
        const isEnd=!stacked||si===series.length-1;
        marks+=`<path class="mk" d="${roundedTop(x,y,w,h,isEnd?4:1)}" fill="${col}" ${meta}/>`;
      }
    });
    // rótulos de categoria
    if(horiz){
      const y=b0+inner/2+3.5;
      marks+=`<text x="${ml-9}" y="${y}" fill="var(--ink-2)" font-size="11" text-anchor="end">${esc(String(c).length>26?String(c).slice(0,25)+'…':c)}</text>`;
    } else {
      const x=b0+inner/2;
      marks+= o.rotate
        ? `<text x="${x}" y="${mt+ih+12}" fill="var(--ink-2)" font-size="10.5" text-anchor="end" transform="rotate(-38 ${x} ${mt+ih+12})">${esc(String(c).length>24?String(c).slice(0,23)+'…':c)}</text>`
        : `<text x="${x}" y="${mt+ih+17}" fill="var(--ink-2)" font-size="11.5" text-anchor="middle">${esc(c)}</text>`;
    }
    // rótulo direto do total (codificação secundária)
    if(o.totalLabels!==false){
      let tot=series.reduce((a,s)=>a+(+s.data[ci]||0),0);
      if(stacked&&tot!==0){
        if(horiz){const x=ml+vpx(Math.max(accP,0))+6;marks+=`<text x="${x}" y="${b0+inner/2+3.5}" fill="var(--ink-2)" font-size="10.5" font-weight="600">${fmtS(tot)}</text>`;}
        else{const y=mt+vpx(Math.max(accP,0))-6;marks+=`<text x="${b0+inner/2}" y="${y}" fill="var(--ink-2)" font-size="10.5" font-weight="600" text-anchor="middle">${fmtS(tot)}</text>`;}
      } else if(!stacked&&series.length===1){
        const v=+series[0].data[ci]||0, sf=o.unit==='%'?'%':'';
        if(horiz){marks+=`<text x="${ml+vpx(Math.max(v,0))+6}" y="${b0+inner/2+3.5}" fill="var(--ink-2)" font-size="10.5" font-weight="600">${fmtS(v)}${sf}</text>`;}
        else{marks+=`<text x="${b0+inner/2}" y="${mt+vpx(Math.max(v,0))-6}" fill="var(--ink-2)" font-size="10.5" font-weight="600" text-anchor="middle">${fmtS(v)}${sf}</text>`;}
      }
    }
  });
  /* No toque, um segmento empilhado pode ter poucos pixels de altura: a coluna
     inteira vira área de toque e mostra todas as séries daquela categoria. */
  let hov='';
  if(o.mob&&!horiz) cats.forEach((c,ci)=>{
    hov+=`<rect class="hvb" x="${ml+ci*band}" y="${mt}" width="${band}" height="${ih}" fill="transparent" data-i="${ci}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'gráfico')}">${g}${marks}${hov}</svg>`;
}

/* Linhas / área */
function chartLine(o){
  const cats=o.cats, series=o.series;
  const W=o.width||820,H=o.height||300,ml=o.mob?52:62,mr=o.mob?34:18,mt=14,mb=32;
  const iw=W-ml-mr, ih=H-mt-mb;
  let lo=0,hi=0;
  series.forEach(s=>s.data.forEach(v=>{if(v==null)return;hi=Math.max(hi,+v);lo=Math.min(lo,+v);}));
  if(hi===lo){hi=lo+1;}
  const ticks=niceTicks(lo,hi,o.ticks||4),t0=ticks[0],t1=ticks[ticks.length-1];
  const py=v=>mt+ih-((v-t0)/(t1-t0))*ih;
  const px=i=>ml+(cats.length===1?iw/2:(i/(cats.length-1))*iw);
  let g='';
  ticks.forEach(t=>{const y=py(t);g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${ml-8}" y="${y+3.5}" fill="var(--muted)" font-size="10.5" text-anchor="end">${fmtS(t)}</text>`;});
  if(lo<0)g+=`<line x1="${ml}" y1="${py(0)}" x2="${ml+iw}" y2="${py(0)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  cats.forEach((c,i)=>{g+=`<text x="${px(i)}" y="${mt+ih+17}" fill="var(--ink-2)" font-size="11.5" text-anchor="middle">${esc(c)}</text>`;});
  let m='';
  series.forEach((s,si)=>{
    const col=s.color||sc(si);
    const pts=s.data.map((v,i)=>v==null?null:[px(i),py(+v)]).filter(Boolean);
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(o.area){
      const base=py(Math.max(t0,Math.min(0,t1)));
      m+=`<path d="${d} L${pts[pts.length-1][0]} ${base} L${pts[0][0]} ${base} Z" fill="${col}" opacity=".14"/>`;
    }
    m+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{m+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="var(--surface)" stroke="${col}" stroke-width="2"/>`;});
    const last=pts[pts.length-1];
    if(series.length<=4)m+=`<text x="${last[0]+7}" y="${last[1]+3.5}" fill="var(--ink-2)" font-size="10.5" font-weight="600">${fmtS(s.data[s.data.length-1])}</text>`;
  });
  // camada de hover (crosshair)
  let hov='';
  cats.forEach((c,i)=>{
    const x=px(i), half=(cats.length>1?iw/(cats.length-1):iw)/2;
    hov+=`<rect class="hv" x="${x-half}" y="${mt}" width="${half*2}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  hov+=`<line class="cross" x1="0" y1="${mt}" x2="0" y2="${mt+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'gráfico de linhas')}">${g}${m}${hov}</svg>`;
}

/* Rosca */
function chartDonut(o){
  const items=o.items.filter(i=>i.v>0);
  const compact=!!o.compact; /* tela pequena: anel centralizado, legenda em HTML abaixo */
  const W=o.width||500,H=o.height||280,cx=compact?W/2:132,cy=H/2,R=Math.min(H,250)/2-12,r=R*0.6;
  const tot=items.reduce((a,i)=>a+i.v,0)||1;
  let a0=-Math.PI/2,m='';
  items.forEach((it,i)=>{
    const frac=it.v/tot, a1=a0+frac*Math.PI*2;
    const gap=frac>0.02?0.018:0.004;
    const s=a0+gap/2,e=a1-gap/2;
    const big=(e-s)>Math.PI?1:0;
    const col=it.c||sc(i);
    const p=(rr,ang)=>[cx+rr*Math.cos(ang),cy+rr*Math.sin(ang)];
    const [x1,y1]=p(R,s),[x2,y2]=p(R,e),[x3,y3]=p(r,e),[x4,y4]=p(r,s);
    m+=`<path class="mk" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r} ${r} 0 ${big} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${col}" data-c="${esc(it.n)}" data-s="${esc(o.measure||'Valor')}" data-v="${it.v}" data-col="${col}" data-p="${(frac*100).toFixed(1)}"/>`;
    a0=a1;
  });
  m+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--ink)" font-size="19" font-weight="650">${fmtS(tot)}</text>`;
  m+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" fill="var(--muted)" font-size="10.5">R$ mil</text>`;
  // rótulos diretos à direita
  let ly=cy-Math.min(items.length,7)*12+6;
  if(!compact) items.slice(0,7).forEach((it,i)=>{
    const col=it.c||sc(i);
    m+=`<rect x="${cx+R+26}" y="${ly-8}" width="9" height="9" rx="2.5" fill="${col}"/>`;
    const nm=String(it.n).length>21?String(it.n).slice(0,20)+'…':it.n;
    m+=`<text x="${cx+R+40}" y="${ly}" fill="var(--ink-2)" font-size="10.5">${esc(nm)}</text>`;
    m+=`<text x="${W-4}" y="${ly}" fill="var(--ink)" font-size="11" font-weight="600" text-anchor="end">${nf1.format(it.v/tot*100)}%</text>`;
    ly+=24;
  });
  return `<svg class="chart fixa" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'gráfico de rosca')}">${m}</svg>`;
}

/* Legenda + ligação de interação + visão em tabela */
function legendHTML(series,line){
  if(series.length<2)return '';
  return '<div class="legend">'+series.map((s,i)=>`<span class="li"><span class="sw${line?' ln':''}" style="background:${s.color||sc(i)}"></span>${esc(s.name)}</span>`).join('')+'</div>';
}
function bindMarks(root,unit){
  root.querySelectorAll('path.mk').forEach(p=>{
    const show=(e,touch)=>{
      root.querySelectorAll('path.mk').forEach(q=>{q.removeAttribute('stroke');q.removeAttribute('stroke-width');});
      p.setAttribute('stroke','var(--surface)');p.setAttribute('stroke-width','2');
      const pp=p.dataset.p?` · ${p.dataset.p}%`:'';
      tipShow(tipRows(p.dataset.c,[{c:p.dataset.col,n:p.dataset.s,v:fmt(+p.dataset.v)+(unit||' mil')+pp}]),e,touch);
    };
    const clear=()=>{p.removeAttribute('stroke');p.removeAttribute('stroke-width');tipHide();};
    p.addEventListener('mouseenter',e=>{if(porToque())return;show(e,false);});
    p.addEventListener('mousemove',e=>{if(porToque()||TIP_TOUCH)return;tipMove(e,false);});
    p.addEventListener('mouseleave',()=>{if(porToque()||TIP_TOUCH)return;clear();});
    p.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')show(e,true);});
  });
}
function bindLine(root,cats,series,unit){
  const cross=root.querySelector('.cross');
  root.querySelectorAll('rect.hv').forEach(rc=>{
    const show=(e,touch)=>{
      const i=+rc.dataset.i;
      const x=+rc.getAttribute('x')+ +rc.getAttribute('width')/2;
      if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','1');}
      tipShow(tipRows(cats[i],series.map((s,si)=>({c:s.color||sc(si),n:s.name,v:s.data[i]==null?SEM_VALOR:fmt(s.data[i])+(unit||' mil')}))),e,touch);
    };
    rc.addEventListener('mouseenter',e=>{if(porToque())return;show(e,false);});
    rc.addEventListener('mousemove',e=>{if(porToque()||TIP_TOUCH)return;tipMove(e,false);});
    rc.addEventListener('mouseleave',()=>{if(porToque()||TIP_TOUCH)return;if(cross)cross.setAttribute('opacity','0');tipHide();});
    rc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')show(e,true);});
  });
}
/* área de toque por categoria nas colunas (celular): mostra a categoria inteira */
function bindCats(root,cats,series,unit){
  root.querySelectorAll('rect.hvb').forEach(rc=>{
    const show=(e,touch)=>{
      const i=+rc.dataset.i;
      const linhas=series.map((s,si)=>({c:s.color||sc(si),n:s.name,v:fmt(s.data[i])+(unit||' mil')})).filter((_,si)=>(+series[si].data[i]||0)!==0);
      if(series.length>1){
        const tot=series.reduce((a,s)=>a+(+s.data[i]||0),0);
        linhas.push({c:'transparent',n:'Total',v:fmt(tot)+(unit||' mil')});
      }
      tipShow(tipRows(cats[i],linhas),e,touch);
    };
    rc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')show(e,true);});
    rc.addEventListener('mouseenter',e=>{if(porToque())return;show(e,false);});
    rc.addEventListener('mousemove',e=>{if(porToque()||TIP_TOUCH)return;tipMove(e,false);});
    rc.addEventListener('mouseleave',()=>{if(porToque()||TIP_TOUCH)return;tipHide();});
  });
}
/* marca as tabelas que rolam para o lado, para desenhar a sombra da coluna fixa */
function markScrollables(root){
  (root||document).querySelectorAll('.tw').forEach(tw=>{
    tw.classList.toggle('scrollable', tw.scrollWidth-tw.clientWidth>4);
  });

function tableFromSeries(cats,series,catLabel){
  let h='<div class="tw"><table class="t"><thead><tr><th>'+esc(catLabel||'Categoria')+'</th>'+series.map(s=>'<th>'+esc(s.name)+'</th>').join('')+(series.length>1?'<th>Total</th>':'')+'</tr></thead><tbody>';
  cats.forEach((c,i)=>{
    const tot=series.reduce((a,s)=>a+(+s.data[i]||0),0);
    h+='<tr><td>'+esc(c)+'</td>'+series.map(s=>'<td class="n'+((+s.data[i]||0)<0?' neg':'')+'">'+fmt(s.data[i])+'</td>').join('')+(series.length>1?'<td class="n">'+fmt(tot)+'</td>':'')+'</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* Cartão de gráfico pronto (chrome + interação + tabela) */
function card(o){
  const d=document.createElement('div');
  d.className='card'+(o.cls?' '+o.cls:'');
  const id='tv'+Math.random().toString(36).slice(2,8);
  let series=o.series||[];
  const lineish=o.type==='line';
  /* Em tela pequena a moldura encolhe: o texto do gráfico cresce em proporção
     e o eixo perde marcações para não embolar. */
  if(isMob()){
    o=Object.assign({},o);
    o.mob=true; o.ticks=3;
    if(o.type==='donut'){ o.compact=true; o.width=420; o.height=300; }
    else { o.width=440; o.height=Math.round((o.height||330)*0.80); }
  }
  let svg='';
  if(o.type==='bars')svg=chartBars(o);
  else if(o.type==='line')svg=chartLine(o);
  else if(o.type==='donut'){
    svg=chartDonut(o);
    const tot=o.items.reduce((a,i)=>a+(i.v>0?i.v:0),0)||1;
    series=o.compact
      ? o.items.filter(i=>i.v>0).map((i,ix)=>({name:i.n+' · '+nf1.format(i.v/tot*100)+'%',color:i.c||sc(ix)}))
      : [];
  }
  d.innerHTML=`<div class="chead"><div class="tx"><h3>${esc(o.title)}</h3>${o.sub?`<p class="sub nb">${esc(o.sub)}</p>`:''}</div>`
    +`<button class="tgl" data-t="${id}">⊞ dados</button></div>`
    +`<div class="viz">`+svg+legendHTML(series,lineish)+`</div>`
    +`<div class="tableview" id="${id}">${o.type==='donut'?tableFromSeries(o.items.map(i=>i.n),[{name:o.measure||'Valor',data:o.items.map(i=>i.v)}],o.catLabel):tableFromSeries(o.cats,series,o.catLabel)}</div>`;
  if(o.type==='line')bindLine(d,o.cats,series,o.unit);
  else{bindMarks(d,o.unit);if(o.mob&&o.type==='bars')bindCats(d,o.cats,o.series,o.unit);}
  d.querySelector('.tgl').addEventListener('click',e=>{const t=d.querySelector('#'+id);t.classList.toggle('on');e.target.classList.toggle('on');});
  return d;
}
function node(html){const t=document.createElement('div');t.innerHTML=html.trim();return t.firstElementChild;}
function kpi(label,value,detail,acc){
  return `<div class="kpi" style="--acc:${acc||'var(--grena)'}"><div class="k">${esc(label)}</div><div class="v">${value}</div>${detail?`<div class="d">${detail}</div>`:''}</div>`;
}

/* Tabela dinâmica genérica (linhas × colunas) */
function pivot(o){
  const {rows,cols,groups,valueFn}=o;
  const F=o.dec?(v=>(v==null||isNaN(v))?SEM_VALOR:new Intl.NumberFormat('pt-BR',{minimumFractionDigits:o.dec,maximumFractionDigits:o.dec}).format(v)):fmt;
  let h='<div class="tw"><table class="t'+(o.cls?' '+o.cls:'')+'"><thead><tr><th>'+esc(o.rowLabel||'')+'</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(o.total!==false?'<th>Total</th>':'')+'</tr></thead><tbody>';
  const renderRow=(label,keyObj,cls)=>{
    let tot=0;const cells=cols.map(c=>{const v=valueFn(keyObj,c);tot+=(+v||0);return '<td class="n'+((+v||0)<0?' neg':'')+'">'+(v==null||v===0?SEM_VALOR:F(v))+'</td>';}).join('');
    return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+esc(label)+'</td>'+cells+(o.total!==false?'<td class="n'+(tot<0?' neg':'')+'">'+F(tot)+'</td>':'')+'</tr>';
  };
  const anyVal=k=>cols.some(c=>{const v=valueFn(k,c);return v!=null&&v!==0;});
  if(groups){
    groups.forEach(g=>{
      if(o.hideEmpty!==false&&!anyVal({group:g.name}))return;
      h+=renderRow(g.name,{group:g.name},'grp');
      g.items.forEach(it=>{const k={group:g.name,item:it};if(o.hideEmpty!==false&&!anyVal(k))return;h+=renderRow(it,k,'sub2');});
    });
  } else rows.forEach(r=>{const k={item:r};if(o.hideEmpty===true&&!anyVal(k))return;h+=renderRow(r,k);});
  if(o.footer!==false){
    let tot=0;const cells=cols.map(c=>{const v=o.totalFn?o.totalFn(c):null;tot+=(+v||0);return '<td class="n'+((+v||0)<0?' neg':'')+'">'+F(v)+'</td>';}).join('');
    if(o.totalFn)h+='<tr class="tot"><td>'+esc(o.totalLabel||'Total')+'</td>'+cells+(o.total!==false?'<td class="n">'+F(tot)+'</td>':'')+'</tr>';
  }
  h+='</tbody></table></div>';
  return h;
}

/* Bloco do cenário sem a premiação do Mundial de Clubes.
   Fica visualmente separado do resto justamente para não se confundir com as
   medidas do painel, que continuam refletindo o publicado. `curto` gera a
   versão enxuta usada dentro do relatório impresso. */
function cenarioMundial(curto,ignoraFiltro){
  /* o relatório cobre sempre a série completa, então lá o bloco não depende do filtro */
  if(!ignoraFiltro&&!YEARS.has(MUNDIAL.ano))return '';
  const s=semMundial(), e=M.ebitda(MUNDIAL.ano), ant=M.ebitda(MUNDIAL.ano-1), y=MUNDIAL.ano;
  const vezes=s.premiacaoAnt?s.premiacao/s.premiacaoAnt:0;
  const cab=`<div class="cenario"><div class="tag">Cenário, não é dado do balanço</div>
    <h3>Quanto do resultado de ${y} veio do Mundial de Clubes</h3>`;
  const longo=`<p>O ${CLUBE.nome} disputou o Mundial de Clubes em junho e julho de ${y} e parou nas oitavas de final. No formato de 32 clubes o torneio só volta em 2029, então essa receita não se repete no exercício seguinte. A demonstração não separa a premiação por competição, mas publica a linha de <strong>participação, exposição e performance</strong>, que reúne todas as premiações do ano. Ela foi de <strong>${fmt(s.premiacao)}</strong> em ${y}, ${nf1.format(vezes)} vezes o valor de ${y-1}, num exercício em que o clube também venceu a Libertadores e o Brasileiro.</p>
    <p>A imprensa calculou a campanha no Mundial em <strong>US$ ${nf1.format(MUNDIAL.usd)} milhões</strong>, da ordem de <strong>${fmt(MUNDIAL.bruta)}</strong> brutos. Tirando esse valor inteiro da receita, o EBITDA recorrente de ${y} cairia de ${fmt(e)} para <strong>${fmt(s.ebitdaSem)}</strong>. Esse é o piso da conta, porque supõe que nenhum custo veio junto com o torneio, quando na prática houve viagens, hospedagem e bônus ao elenco. Mesmo no piso a operação segue positiva, ${s.ebitdaSem>=ant?'acima':'abaixo'} dos ${fmt(ant)} de ${y-1}.</p>`;
  const nucleo=curto
    ? `<p>O clube disputou o Mundial de Clubes de ${y}, torneio que só volta em 2029, e no mesmo ano venceu a Libertadores e o Brasileiro. As premiações somaram <strong>${fmt(s.premiacao)}</strong>, contra <strong>${fmt(s.premiacaoAnt)}</strong> em ${y-1}. Sem elas a receita operacional de ${y} seria de <strong>${fmt(s.semPrem)}</strong>, ${compara(s.semPrem,s.semPremAnt)} de ${y-1}.</p>
       <p>Retirada só a parcela do Mundial, estimada pela imprensa em ${fmt(MUNDIAL.bruta)} brutos, o EBITDA recorrente de ${y} ficaria em pelo menos ${fmt(s.ebitdaSem)}, e não nos ${fmt(e)} apurados.</p>`
    : longo;
  const extra=curto?'':`<p>Sem as premiações de todas as competições, a receita operacional seria de <strong>${fmt(s.semPrem)}</strong> em ${y}, contra <strong>${fmt(s.semPremAnt)}</strong> em ${y-1}, variação de <strong>${nf1.format(s.cresceSemPrem*100)}%</strong>. É essa a parte da receita que não depende de campanha, ${Math.abs(s.cresceSemPrem)<0.03?'e ela ficou estável de um ano para o outro':s.cresceSemPrem>0?'e ela cresceu de um ano para o outro':'e ela recuou de um ano para o outro'}.</p>`;
  const rodape=curto
    ? `<p class="fonte">A linha de premiações é auditada. A parcela do Mundial é estimativa de imprensa, porque as demonstrações de ${y} não abrem a receita por competição. Nenhum indicador deste relatório desconta o efeito.</p>`
    : `<p class="fonte">A linha de participação, exposição e performance é publicada nas notas explicativas e é auditada. Já a parcela do Mundial é estimativa, porque as demonstrações de ${y} não abrem a receita por competição. Premiação em dólares conforme ${esc(MUNDIAL.fonte)}. A Copa Intercontinental de dezembro também pagou premiação, noticiada na casa de US$ 5 milhões, que fica dentro da mesma linha. Nenhum indicador do painel desconta este efeito.</p>`;
  return cab+nucleo+extra+rodape+'</div>';
}

/* Tabela ranqueada: dimensão, valor e % do total */
function ranked(rows,dim,title,sub,limit){
  const m=groupSum(rows,r=>r[dim]);
  const arr=[...m.entries()].filter(e=>e[1]).sort((a,b)=>b[1]-a[1]);
  const tot=arr.reduce((a,e)=>a+e[1],0)||1;
  const max=arr.length?arr[0][1]:1;
  const shown=limit?arr.slice(0,limit):arr;
  let h=`<div class="card"><div class="chead"><div class="tx"><h3>${esc(title)}</h3><p class="sub nb">${esc(sub)}</p></div></div>`;
  h+='<div class="tw"><table class="t"><thead><tr><th>'+(dim==='atleta'?'Atleta':dim==='contraparte'?'Contraparte':'Item')+'</th><th>Valor</th><th>%</th></tr></thead><tbody>';
  shown.forEach(([k,v])=>{
    h+=`<tr><td>${esc(k)}</td><td class="n bar-cell"><i style="width:${(v/max*100).toFixed(1)}%"></i><span>${fmt(v)}</span></td><td>${nf1.format(v/tot*100)}%</td></tr>`;
  });
  h+=`<tr class="tot"><td>Total</td><td class="n">${fmt(tot)}</td><td>100,0%</td></tr>`;
  h+='</tbody></table></div></div>';
  return h;
}

  const k=document.createElement('div');k.className='grid g4';k.style.marginBottom='16px';
  const ult=a.length?a[a.length-1]:2025;
  k.innerHTML=kpi('Receita operacional '+ult,fmt(M.receitaOperacional(ult)),'R$ mil',sc(1))
    +kpi('EBITDA recorrente '+ult,fmt(M.ebitda(ult)),'Sem negociação de atletas',sc(0))
    +kpi('EBITDA total '+ult,fmt(M.ebitdaTotal(ult)),'Com transferências e extraordinários',sc(1))
    +kpi('Resultado líquido '+ult,fmt(M.resultado(ult)),'R$ mil',M.resultado(ult)>=0?sc(1):sc(0));
  w.appendChild(k);
  w.appendChild(node(h));
  const g2=document.createElement('div');g2.className='grid g2';g2.style.marginTop='16px';
  g2.appendChild(card({title:'EBITDA recorrente × EBITDA total',sub:'Em R$ mil. O intervalo entre as barras é a dependência de transferências',type:'bars',cats:a.map(String),catLabel:'Ano',height:300,
    series:[{name:'EBITDA (recorrente)',data:a.map(M.ebitda),color:sc(0)},{name:'EBITDA total',data:a.map(M.ebitdaTotal),color:sc(1)}]}));
  g2.appendChild(card({title:'Resultado líquido',sub:'R$ mil, por ano',type:'line',area:true,cats:a.map(String),catLabel:'Ano',height:300,
    series:[{name:'Resultado líquido',data:a.map(M.resultado),color:sc(0)}]}));
  w.appendChild(g2);
  w.appendChild(node('<div class="note" style="margin-top:16px">O <strong>EBITDA recorrente</strong> mede a operação do futebol sem venda de atletas; o <strong>EBITDA total</strong> incorpora transferências e receitas extraordinárias. A distância entre os dois indica o grau de dependência de receitas não recorrentes.</div>'));

  /* reconciliação com as demonstrações auditadas */
  const NOTAS={
    2020:'As linhas da receita bruta somam 1 a menos que o total publicado, por arredondamento da própria demonstração.',
    2021:'As linhas da nota 18 da demonstração de 2022 somam 761.565 contra 761.610 no total do custo publicado. A diferença de 45 está na própria demonstração.',
  };
  let hr='<div class="card" style="margin-top:16px"><h3>Reconciliação com as demonstrações auditadas</h3>'
    +'<p class="sub">Resultado do painel confrontado com o superávit publicado, em R$ mil</p>'
    +'<div class="tw"><table class="t"><thead><tr><th>Linha</th>'+a.map(y=>'<th>'+y+'</th>').join('')+'</tr></thead><tbody>';
  hr+='<tr><td>Resultado calculado no painel</td>'+a.map(y=>{const v=M.resultado(y);return '<td class="n'+(v<0?' neg':'')+'">'+fmt(v)+'</td>';}).join('')+'</tr>';
  hr+='<tr><td>Superávit (déficit) publicado</td>'+a.map(y=>{const v=B.dre('superavit',y);return '<td class="n'+(v<0?' neg':'')+'">'+fmt(v)+'</td>';}).join('')+'</tr>';
  hr+='<tr class="hl"><td>Diferença</td>'+a.map(y=>{const d=M.resultado(y)-B.dre('superavit',y);return '<td class="n'+(d<0?' neg':'')+'">'+(Math.abs(d)<100?SEM_VALOR:fmt(d))+'</td>';}).join('')+'</tr>';
  hr+='<tr><td>Situação</td>'+a.map(y=>{
      const d=Math.abs(M.resultado(y)-B.dre('superavit',y));
      return '<td>'+(d<100?B.selo('ok','Confere'):B.selo('ruim','Divergente'))+'</td>';
    }).join('')+'</tr>';
  hr+='</tbody></table></div>';
  const pend=a.filter(y=>NOTAS[y]&&Math.abs(M.resultado(y)-B.dre('superavit',y))>=100);
  if(pend.length)hr+='<div style="margin-top:12px;display:grid;gap:8px">'
    +pend.map(y=>`<div class="note"><strong>${y}:</strong> ${NOTAS[y]}</div>`).join('')+'</div>';
  hr+='</div>';
  w.appendChild(node(hr));
  /* A forma de apresentar a venda de atletas mudou em 2024, e quem comparar com as
     demonstrações vai notar. A explicação precisa estar escrita. */
  w.appendChild(node(`<div class="note" style="margin-top:12px"><strong>Como a série foi montada.</strong> Até 2023 o ${CLUBE.nome} registrava a venda de atletas dentro da receita bruta. A partir de 2024 a demonstração passou a apresentá-la em outras receitas operacionais, junto com a baixa dos direitos vendidos. O painel leva a receita com transferências para a mesma linha em todos os anos e trata baixas, repasses e gastos com negociação abaixo do EBITDA, para que a série fique comparável. Os valores são os da controladora. A Fla-Flu Serviços, concessionária do Maracanã, entra pelo resultado de equivalência patrimonial.</div>`));
}},

/* ---------- 4. Direitos de Transmissão ---------- */
{id:'direitos',nome:'Direitos de Transmissão',grupo:'Receita',desc:'Broadcasting por tipo e competição',render(w){
  const a=anosSel(), rows=DATA.detalheDireitos.filter(inY);
  const tipos=uniq(DATA.detalheDireitos,r=>r.tipo), comps=uniq(DATA.detalheDireitos,r=>r.competicao);
  w.innerHTML=sec('Análise dos direitos de transmissão','Detalhamento da receita de broadcasting (R$ mil)');
  const ini=a[0], ult=a[a.length-1];
  const dt=y=>sum(DATA.detalheDireitos.filter(r=>r.ano===y));
  const totDir=sum(rows), recOpUlt=M.receitaOperacional(ult);
  const pesoDir=recOpUlt?dt(ult)/recOpUlt:0;
  /* A demonstração de 2025 não abriu a receita por tipo nem por competição: lançou
     tudo numa categoria consolidada. Misturar esse ano com os demais distorceria
     qualquer leitura de composição, então a página separa duas perguntas.
     O TOTAL por ano usa todos os anos, porque é comparável.
     A COMPOSIÇÃO usa só os anos com abertura detalhada. */
  const CONSOLIDADA='Direitos de transmissão e premiações por performance';
  const temAbertura=y=>DATA.detalheDireitos.some(r=>r.ano===y&&r.tipo!==CONSOLIDADA);
  const anosDet=a.filter(temAbertura);
  const anosSem=a.filter(y=>!temAbertura(y));
  const rowsDet=rows.filter(r=>r.tipo!==CONSOLIDADA&&temAbertura(r.ano));
  const tiposDet=uniq(DATA.detalheDireitos.filter(r=>r.tipo!==CONSOLIDADA),r=>r.tipo);
  const compsDet=uniq(DATA.detalheDireitos.filter(r=>r.tipo!==CONSOLIDADA),r=>r.competicao);
  const porTipo=tiposDet.map(t=>({n:t,v:sum(rowsDet.filter(r=>r.tipo===t))})).sort((x,y)=>y.v-x.v);
  const maior=porTipo[0]||{n:'',v:0}, segundo=porTipo[1]||{n:'',v:0};
  const baseDetalhada=porTipo.reduce((s,x)=>s+x.v,0);
  const faixaDet=anosDet.length?(anosDet.length===1?String(anosDet[0]):anosDet[0]+' a '+anosDet[anosDet.length-1]):'';
  const subDet='Somente os anos com abertura detalhada'+(faixaDet?' ('+faixaDet+')':'')+', em R$ mil';
  w.appendChild(grid('g23',
    analise(
      [{k:'Receita de transmissão '+ult,v:fmt(dt(ult))},
       {k:'Peso na receita operacional',v:nf1.format(pesoDir*100)+'%'},
       {k:'Acumulado no período',v:fmt(totDir)}],
      ['A maior fonte de receita do clube',
       `Direitos de transmissão e premiações representam <span class="fig">${nf1.format(pesoDir*100)}%</span> da receita operacional de ${ult}. É a maior linha de receita, mas não domina o faturamento, porque patrocínio, licenciamento, sócio-torcedor e estádio somam mais do que ela. O que a torna sensível é a parte variável, que depende do desempenho em campo.`,
       ini===ult?'' : `Entre ${ini} e ${ult} essa receita saiu de <span class="fig">${fmt(dt(ini))}</span> para <span class="fig">${fmt(dt(ult))}</span>.`],
      ['Como a receita se divide',
       'São três componentes. Os <strong>direitos de transmissão fixos</strong> são a parcela contratada e previsível. A linha de <strong>participação, exposição e performance</strong> reúne as premiações e oscila com as campanhas. As <strong>mídias digitais e serviços on demand</strong> reuniam o pay-per-view e o streaming, e encolheram em 2025, quando entrou em vigor o novo contrato do Brasileiro para 2025 a 2029.',
       maior.v?`No período selecionado, ${esc(maior.n.toLowerCase())} responde por <span class="fig">${fmt(maior.v)}</span>, ou <span class="fig">${nf1.format(maior.v/baseDetalhada*100)}%</span> do total, seguido de ${esc(segundo.n.toLowerCase())} com <span class="fig">${fmt(segundo.v)}</span>.`:''],
      anosSem.length?['Por que '+anosSem.join(' e ')+' fica fora da composição',
       `A demonstração de ${anosSem.join(' e ')} não abriu a receita de transmissão por tipo nem por competição: lançou tudo em uma linha consolidada. Somar essa linha às dos anos anteriores criaria um componente artificial e distorceria qualquer leitura de participação.`,
       anosSem.includes(MUNDIAL.ano)?`Essa linha consolidada de ${MUNDIAL.ano} também abriga a premiação do Mundial de Clubes, que é receita de um torneio que só se repete em 2029. O bloco no fim da página dimensiona esse efeito.`:'',
       `Por isso a página separa duas perguntas. A <strong>evolução do total</strong> usa todos os anos, porque o valor cheio é comparável. A <strong>composição por tipo e por competição</strong> usa apenas os anos com abertura detalhada${faixaDet?', de '+esc(faixaDet):''}.`]:[]),
    card({title:'Evolução da receita de direitos de transmissão',sub:'Total por ano, em R$ mil. Inclui todos os anos selecionados',type:'bars',cats:a.map(String),catLabel:'Ano',height:500,
      series:[{name:'Direitos de transmissão e premiações',data:a.map(y=>dt(y)),color:sc(0)}]})));

  if(anosSem.length)w.appendChild(node(`<div class="note" style="margin:16px 0 0">Os visuais de composição abaixo consideram apenas ${faixaDet||'os anos com abertura detalhada'}. ${anosSem.join(' e ')} entra somente no total acima, porque a demonstração daquele exercício não abriu a receita por tipo nem por competição.</div>`));

  const g=document.createElement('div');g.className='grid g32';g.style.marginTop='16px';
  if(compsDet.length>1)g.appendChild(node(`<div class="card"><h3>Composição por competição</h3><p class="sub">Competição por tipo de receita. ${esc(subDet)}</p>`
    +pivot({groups:compsDet.map(c=>({name:c,items:tiposDet})),cols:anosDet,rowLabel:'Competição / tipo',
      valueFn:(k,c)=>k.item==null?sum(rowsDet.filter(r=>r.competicao===k.group&&r.ano===c)):sum(rowsDet.filter(r=>r.competicao===k.group&&r.tipo===k.item&&r.ano===c)),
      totalFn:c=>sum(rowsDet.filter(r=>r.ano===c))})+`</div>`));
  else g.appendChild(node(`<div class="card"><h3>Detalhamento por tipo de receita</h3><p class="sub">As demonstrações abrem a receita por tipo, não por competição. ${esc(subDet)}</p>`
    +pivot({rows:tiposDet,cols:anosDet,rowLabel:'Tipo de receita',
      valueFn:(k,c)=>sum(rowsDet.filter(r=>r.tipo===k.item&&r.ano===c)),
      totalFn:c=>sum(rowsDet.filter(r=>r.ano===c))})+`</div>`));
  /* a coluna da direita empilha os dois visuais de composição para acompanhar a altura do detalhamento */
  const dir=document.createElement('div');dir.className='pilha';
  dir.appendChild(card({title:'Composição por tipo de receita',sub:subDet,type:'bars',stacked:true,cats:anosDet.map(String),catLabel:'Ano',height:300,
    series:tiposDet.map((t,i)=>({name:t,data:anosDet.map(y=>sum(rowsDet.filter(r=>r.tipo===t&&r.ano===y))),color:sc(i)}))}));
  dir.appendChild(card({title:'Participação por tipo de receita',sub:subDet,type:'donut',measure:'Direitos de transmissão',catLabel:'Tipo',height:300,width:460,
    items:tiposDet.map((t,i)=>({n:t,v:sum(rowsDet.filter(r=>r.tipo===t)),c:sc(i)})).sort((x,y)=>y.v-x.v)}));
  g.appendChild(dir);
  w.appendChild(g);
  if(DATA.direitosTransmissao.length){
  const comp2=uniq(DATA.direitosTransmissao,r=>r.competicao);
  w.appendChild(node(`<div class="card" style="margin-top:16px"><h3>Receita de transmissão por campeonato</h3><p class="sub">Base consolidada por competição. ${esc(subDet)}</p>`
    +pivot({hideEmpty:true,rows:comp2,cols:anosDet,rowLabel:'Campeonato',
      valueFn:(k,c)=>sum(DATA.direitosTransmissao.filter(r=>r.competicao===k.item&&r.ano===c)),
      totalFn:c=>sum(DATA.direitosTransmissao.filter(r=>r.ano===c))})+`</div>`));
  }
  if(cenarioMundial())w.appendChild(node(cenarioMundial()));
}},

  r2.appendChild(card({title:'Detalhamento da dívida por ano',sub:'R$ mil, empilhado por perfil',type:'bars',stacked:true,cats:a.map(String),catLabel:'Ano',height:320,

  const prazos=uniq(DATA.circulante,r=>r.prazo), tipC=uniq(DATA.circulante,r=>r.tipo);

/* ---------- Balanço e solvência ---------- */
{id:'balanco',nome:'Balanço e Solvência',grupo:'Balanço',desc:'Ativo, passivo, patrimônio líquido e liquidez',render(w){
  const a=anosSel(), ult=a.length?a[a.length-1]:2025;
  w.innerHTML=sec('Balanço patrimonial e solvência','Posição patrimonial e capacidade de honrar compromissos (R$ mil)');
  const k=document.createElement('div');k.className='grid g4';
  const pl=B.pl(ult), lc=B.liquidezCorrente(ult), ccl=B.capitalCirculante(ult), dl=B.dividaLiquida(ult);
  k.innerHTML=kpi('Patrimônio líquido '+ult,fmt(pl),pl<0?'Passivo a descoberto':'Positivo',pl<0?'var(--bad)':'var(--s2)')
    +kpi('Liquidez corrente '+ult,cob(lc),'Quanto do passivo circulante o ativo circulante cobre. Equilíbrio em 100%',lc<1?'var(--bad)':'var(--s2)')
    +kpi('Capital circulante líquido',fmt(ccl),'Ativo circulante menos passivo circulante',ccl<0?'var(--bad)':'var(--s2)')
    +kpi('Dívida financeira líquida',fmt(dl),'Empréstimos menos caixa. Não é o passivo total',sc(3));
  w.appendChild(k);
  const g=document.createElement('div');g.className='grid g2';g.style.marginTop='16px';
  g.appendChild(card({title:'Ativo total × passivo total',sub:'Em R$ mil, por ano. A diferença entre as duas barras é o patrimônio líquido',type:'bars',cats:a.map(String),catLabel:'Ano',height:310,
    series:[{name:'Ativo total',data:a.map(y=>B.t('ativoTotal',y)),color:sc(1)},{name:'Passivo total',data:a.map(y=>B.t('passivoTotal',y)),color:sc(0)}]}));
  g.appendChild(card({title:'Patrimônio líquido',sub:'Em R$ mil. Valor negativo significa passivo a descoberto',type:'line',area:true,cats:a.map(String),catLabel:'Ano',height:310,
    series:[{name:'Patrimônio líquido',data:a.map(y=>B.t('patrimonioLiquido',y)),color:sc(0)}]}));
  w.appendChild(g);
  const g2=document.createElement('div');g2.className='grid g2';g2.style.marginTop='16px';
  const compAtivo=['Circulante','Intangível','Imobilizado','Realizável a longo prazo'];
  g2.appendChild(card({title:'Composição do ativo',sub:'R$ mil, empilhado por ano',type:'bars',stacked:true,cats:a.map(String),catLabel:'Ano',height:310,
    series:[
      {name:'Circulante',data:a.map(y=>B.t('ativoCirculante',y)),color:sc(1)},
      {name:'Imobilizado',data:a.map(y=>B.b('ativoNaoCirculante','Imobilizado',y)),color:sc(3)},
      {name:'Intangível',data:a.map(y=>B.b('ativoNaoCirculante','Intangível',y)),color:sc(2)},
      {name:'Demais realizáveis',data:a.map(y=>B.t('ativoNaoCirculante',y)-B.b('ativoNaoCirculante','Imobilizado',y)-B.b('ativoNaoCirculante','Intangível',y)),color:sc(5)},
    ]}));
  g2.appendChild(card({title:'Liquidez corrente',sub:'Quanto do passivo circulante o ativo circulante cobre. A linha tracejada marca o equilíbrio de 100%',type:'bars',cats:a.map(String),catLabel:'Ano',height:310,unit:'%',
    ref:100,refLabel:'100%',
    series:[{name:'Cobertura do passivo circulante',data:a.map(y=>Math.round(B.liquidezCorrente(y)*100)),color:sc(0)}]}));
  w.appendChild(g2);
  /* Ativo e passivo em tabelas separadas: numa tabela só, a linha de total não
     corresponderia à soma dos grupos exibidos, porque metade deles é contrapartida
     da outra. Separados, cada lado fecha no próprio total e os dois se igualam. */
  const gr=(sec_,titulo)=>({name:titulo,items:Object.keys(DATA.df.balanco[sec_])});
  const mapa={'Circulante ':'ativoCirculante','Não circulante ':'ativoNaoCirculante',
              'Circulante':'passivoCirculante','Não circulante':'passivoNaoCirculante'};
  const lado=(titulo,sub,grupos,rotuloTotal)=>node(`<div class="card"><h3>${esc(titulo)}</h3><p class="sub">${esc(sub)}</p>`
    +pivot({cols:a,rowLabel:'Conta',hideEmpty:false,total:false,groups:grupos,
      valueFn:(k,c)=>{
        if(k.group==='Patrimônio líquido')return B.pl(c);
        const sec2=mapa[k.group];
        return k.item==null?B.t(sec2,c):B.b(sec2,k.item,c);
      },
      totalFn:c=>B.t('ativoTotal',c),totalLabel:rotuloTotal})+`</div>`);
  /* empilhadas em largura total: os dois lados têm números de linhas bem diferentes,
     e assim cada tabela aproveita a largura para as seis colunas de ano */
  const cAtivo=lado('Ativo','Conforme as demonstrações contábeis auditadas, em R$ mil',
    [Object.assign(gr('ativoCirculante','x'),{name:'Circulante '}),Object.assign(gr('ativoNaoCirculante','x'),{name:'Não circulante '})],
    'Total do ativo');
  const cPassivo=lado('Passivo e patrimônio líquido','Conforme as demonstrações contábeis auditadas, em R$ mil. O total iguala o do ativo',
    [Object.assign(gr('passivoCirculante','x'),{name:'Circulante'}),Object.assign(gr('passivoNaoCirculante','x'),{name:'Não circulante'}),
     {name:'Patrimônio líquido',items:[]}],
    'Total do passivo e patrimônio líquido');
  cAtivo.style.marginTop='16px';cPassivo.style.marginTop='16px';
  w.appendChild(cAtivo);w.appendChild(cPassivo);
  w.appendChild(node(`<div class="note" style="margin-top:16px">O que o painel chama de <strong>dívida total</strong> nas demais páginas é o <strong>passivo total</strong>, ou seja, todos os compromissos do clube. A dívida financeira propriamente dita (empréstimos e financiamentos) somava ${fmt(B.dividaBruta(ult))} em ${ult}, e ${fmt(B.dividaLiquida(ult))} descontado o caixa. São leituras muito diferentes de risco.</div>`));
}},

{id:'indicadores',nome:'Indicadores',grupo:'Apoio',desc:'Custo de elenco, dependência e solvência',render(w){

  w.appendChild(node('<div class="note" style="margin-top:16px">Só os tetos de custo de elenco e o limite de dívida de curto prazo vêm de norma. As faixas marcadas como convenção foram definidas para este painel a partir de prática de análise de crédito aplicada a clubes, e não têm respaldo normativo: servem para leitura rápida, não para classificação formal. O equilíbrio de 100% na liquidez corrente é definição contábil: é o ponto em que o ativo circulante iguala o passivo circulante.</div>'));
  w.appendChild(node('<div class="note" style="margin-top:12px">O denominador usado é a receita total do exercício, somando receita operacional e receita com negociação de atletas. Vale notar que a lei do PROFUT fala em receita bruta sem detalhar a composição: se apenas a receita operacional fosse considerada, o indicador de '+ult+' subiria de '+nf1.format(REFS.profut.calc(ult)*100)+'% para '+nf1.format(B.wageRatio(ult)*100)+'%.</div>'));
