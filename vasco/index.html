          ['Patrimônio líquido',B.pl(ult),null,'hl'],
        ];
        return '<div class="tw"><table class="t dre"><thead><tr><th>Conta</th><th>R$ mil</th><th>Do passivo</th></tr></thead><tbody>'
          +linhas.map(([n,v,pc,cls])=>`<tr${cls?' class="'+cls+'"':''}><td>${esc(n)}</td><td class="n${v<0?' neg':''}">${fmt(v)}</td><td>${pc==null?SEM_VALOR:nf1.format(pc*100)+'%'}</td></tr>`).join('')
          +'</tbody></table></div>';
      })()}
      </div>`));

    w.appendChild(node(`<div class="folha"><p class="eyebrow">Diligência</p><h2>Riscos a verificar antes de qualquer proposta</h2>
      <p>Além do que aparece nas demonstrações, uma diligência precisaria confirmar o cronograma de pagamento por classe de credor no plano homologado, a habilitação final dos créditos ainda em discussão, o desfecho da disputa societária com a 777 Partners e as condições do capital subscrito e não integralizado de ${fmt(CAPITAL_FALTA)}. Também entram na lista os processos com perda possível, hoje em ${fmt(CONT_POSSIVEIS)}, e as obrigações em moeda estrangeira por negociações de atletas.</p>
      ${tabelaRiscos()}
      ${cenarioRJ(true,true)}</div>`));

    w.appendChild(node(`<div class="folha"><p class="eyebrow">Síntese</p><h2>Análise SWOT sob a ótica do investidor</h2>
      ${swot(
        [`Marca e torcida de alcance nacional, com bilheteria de <b>${fmt(bilhete(ult))}</b> em ${ult}`,
         `Veículo societário já constituído, pronto para receber capital`,
         `Passivo reorganizado por plano homologado, com ajuste a valor presente de <b>${fmt(RJ.avp)}</b>`,
         `Receita operacional líquida <b>${nf1.format(cresceRecSAF)}</b> vezes maior que a de 2023`,
         `Elenco registrado em <b>${fmt(bal('ativoNaoCirculante','Intangível',ult))}</b> de intangível`],
        [`Patrimônio líquido negativo de <b>${fmt(Math.abs(B.pl(ult)))}</b>`,
         `Operação recorrente deficitária em todos os anos da SAF`,
         `Capital circulante líquido de <b>${fmt(B.capitalCirculante(ult))}</b>`,
         `Custo de elenco de <b>${nf1.format(REFS.cbf.calc(ult)*100)}%</b>, acima do teto da CBF`,
         `Ativo fixo reduzido, já que os imóveis ficaram com o clube associativo`],
        [`Corte de custo com efeito imediato no EBITDA, que hoje é o maior gargalo`,
         `Base formadora com saídas recorrentes para o exterior`,
         `Sócio torcedor e licenciamento com espaço grande diante do tamanho da torcida`,
         `Passivo alongado libera caixa para investir na operação`,
         `Entrada de capital reprecificada depois da recuperação judicial`],
        [`Descumprimento do plano com reabertura das execuções`,
         `Fair play financeiro da CBF com cobrança plena em 2028 e punição esportiva`,
         `Queda de divisão derruba transmissão, bilheteria e premiação ao mesmo tempo`,
         `Litígio societário pendente com o investidor anterior`,
         `Dependência de venda de atletas para fechar o exercício`])}
      <h3>Condicionantes da tese</h3>
      <p>A tese se sustenta se três condições forem verdadeiras ao mesmo tempo. O EBITDA recorrente precisa virar positivo, e isso passa por reduzir a folha antes de qualquer coisa. O plano de recuperação judicial precisa ser cumprido sem renegociação nova. E o capital subscrito precisa entrar, porque sem aporte o patrimônio negativo só se fecha com muitos anos de lucro operacional. Se qualquer uma falhar, o alívio de ${ult} terá comprado tempo sem resolver a causa.</p>
      <div class="aviso">Este documento reúne e organiza informações das demonstrações contábeis de ${ini} a ${ult}. Não constitui recomendação de investimento, avaliação econômica formal, laudo de avaliação nem oferta. Qualquer decisão exige diligência independente e assessoria própria. O autor não é consultor de investimentos.</div></div>`));
  }
}},

/* ---------- 12. Referências ---------- */
{id:'ref',nome:'Referências e Informações',grupo:'Apoio',desc:'Metodologia, indicadores e fontes',render(w){
  w.innerHTML=sec('Referências e outras informações','Metodologia, definições e fontes do painel');
  w.appendChild(grid('g2',
    `<div class="card prose">
      <h3 style="margin-bottom:8px">Metodologia</h3>
      <p>Este painel foi desenvolvido com base nas melhores práticas internacionais de análise financeira aplicadas à indústria do futebol, utilizando como principais referências metodológicas os relatórios da <strong>Deloitte Football Money League</strong>, os regulamentos de <strong>Fair Play Financeiro da UEFA</strong>, modelos de análise de clubes estruturados por instituições financeiras e relatórios oficiais de demonstrações financeiras publicados por clubes brasileiros e europeus.</p>
      <p><strong>Fontes desta edição.</strong> Os exercícios de 2020 e 2021 vêm das demonstrações contábeis do Club de Regatas Vasco da Gama referentes a 2021, que trazem 2020 reapresentado. O exercício de 2022 vem das demonstrações da Vasco da Gama SAF do período de 8 de agosto a 31 de dezembro de 2022. O de 2023 vem das demonstrações da SAF de 2023 e os de 2024 e 2025 vêm das demonstrações da SAF de 2025, que trazem 2024 como comparativo.</p>
      <p>A estrutura do modelo segue a separação padrão entre receitas operacionais, resultado com negociação de atletas, custos operacionais, resultado financeiro e resultado líquido, permitindo uma visão clara da sustentabilidade operacional e da dependência de receitas não recorrentes.</p>
      <p>Os valores apresentados estão em <strong>milhares de reais (R$ mil)</strong> e refletem exclusivamente informações extraídas das demonstrações financeiras oficiais do clube.</p>
    </div>`,
    `<div class="card prose">
      <h3 style="margin-bottom:8px">Indicadores financeiros</h3>
      <p><strong>Receita operacional:</strong> receitas recorrentes das atividades principais do clube, como direitos de transmissão, marketing e patrocínio, programa sócio torcedor, bilheteria, licenciamento e premiações. O painel mostra a receita bruta e abate as deduções para chegar à receita líquida publicada.</p>
      <p><strong>Resultado com negociação de atletas:</strong> impacto financeiro líquido das transferências, permitindo avaliar o grau de dependência de receitas não recorrentes.</p>
      <p><strong>EBITDA:</strong> capacidade de gerar resultado a partir das operações principais, desconsiderando efeitos contábeis e financeiros.</p>
      <p><strong>Resultado operacional (EBIT):</strong> resultado após depreciações e amortizações, refletindo o desempenho operacional completo.</p>
      <p><strong>Resultado financeiro:</strong> efeitos de juros, encargos financeiros e variações cambiais, demonstrando o impacto da estrutura de endividamento.</p>
      <p><strong>Resultado líquido:</strong> resultado final do período, consolidando todos os efeitos operacionais, financeiros e não recorrentes.</p>
    </div>`));
  const LINKS={
    profut:{url:'https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13155.htm',texto:'Lei 13.155/2015 no Planalto'},
    cbf:{url:'https://ge.globo.com/sp/futebol/noticia/2025/11/26/cbf-anuncia-o-fair-play-financeiro-veja-regras-punicoes-e-cronograma.ghtml',texto:'Regras, punições e cronograma no ge'},
    uefa:{url:'https://www.uefa.com/running-competitions/integrity/financial-sustainability/',texto:'Financial sustainability na UEFA'},
  };
  let hr='<div class="card" style="margin-top:16px"><h3>Referências normativas de custo de elenco</h3>'
    +'<p class="sub">As três regras usadas na página de indicadores. Cada uma define o próprio numerador, por isso os percentuais não são comparáveis entre si</p>'
    +'<div class="tw"><table class="t"><thead><tr><th>Referência</th><th>Teto</th><th>O que entra na conta</th><th>Base de receita</th><th>Aplicação</th><th>Fonte</th></tr></thead><tbody>';
  Object.keys(REFS).forEach(kk=>{
    const r=REFS[kk], l=LINKS[kk];
    hr+=`<tr><td><strong>${esc(r.titulo)}</strong></td>`
      +`<td>${esc(r.rotulo)}${r.rotuloExtra?'<br><span style="color:var(--muted)">'+esc(r.rotuloExtra)+'</span>':''}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:190px">${esc(r.metrica)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:130px">${esc(r.base)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:230px">${esc(r.vigor)}</td>`
      +`<td style="white-space:normal;text-align:left;min-width:150px"><a href="${l.url}" target="_blank" rel="noopener">${esc(l.texto)}</a></td></tr>`;
  });
  hr+='</tbody></table></div>'
    +'<p class="sub" style="margin:12px 0 0">O limite de dívida de curto prazo em 45% da receita, cobrado até 2030, também vem do regulamento da CBF. As demais faixas do painel de indicadores são convenção de leitura adotada aqui, sem respaldo normativo.</p></div>';
  w.appendChild(node(hr));
  const NOMES={receitaBruta:'Receita bruta com futebol',custosOperacionais:'Custos operacionais',outrosCustos:'Outros custos e despesas',perfilDivida:'Perfil da dívida',composicaoDivida:'Composição da dívida',circulante:'Circulante e não circulante',detalheDireitos:'Direitos de transmissão e premiações',receitaFinanceira:'Receitas financeiras',despesaFinanceira:'Despesas financeiras',transferencias:'Vendas de atletas por negociação',custosTransferencia:'Investimento em elenco',elenco:'Composição do intangível de atletas',bilheteria:'Renda de jogos por competição'};
  w.appendChild(node(`<div class="card" style="margin-top:16px"><h3>Conjuntos de dados</h3><p class="sub">Séries que alimentam as análises deste painel</p>`
    +'<div class="tw"><table class="t"><thead><tr><th>Conjunto</th><th>Registros</th><th>Período</th></tr></thead><tbody>'
    +Object.entries(DATA).filter(([,v])=>Array.isArray(v)&&v.length).map(([k,v])=>{const y=v.map(r=>r.ano).filter(x=>x!=null);const p=y.length?Math.min(...y)+' a '+Math.max(...y):SEM_VALOR;return `<tr><td>${esc(NOMES[k]||k)}</td><td class="n">${fmt(v.length)}</td><td>${p}</td></tr>`;}).join('')
    +`<tr><td>Demonstrações contábeis auditadas</td><td class="n">${fmt(Object.keys(DATA.df.balanco).reduce((s,g)=>s+Object.keys(DATA.df.balanco[g]).length,0)*DATA.df.anos.length)}</td><td>${DATA.df.anos[0]} a ${DATA.df.anos[DATA.df.anos.length-1]}</td></tr>`
    +'</tbody></table></div></div>'));
  w.appendChild(node(`<div class="card prose" style="margin-top:16px">
    <p>Painel desenvolvido como ferramenta de análise financeira aplicada ao futebol, com foco em transparência, comparabilidade e suporte à tomada de decisão.</p>
    <p><strong>Victor Belchior</strong><br>victorbelchior25@gmail.com</p>
    <p class="sub">Aplicação web autocontida: todos os dados e gráficos estão neste próprio arquivo, sem dependências externas, e funcionam também sem conexão.</p></div>`));
  w.appendChild(node(`<div class="note" style="margin-top:16px">${AVISO_SERIE}</div>`));
  w.appendChild(node(`<div class="note" style="margin-top:12px"><strong>Duas ressalvas sobre as fontes.</strong> A nota de receita de 2024 e 2025 lista a linha Tour da Colina, de 1.723 e 1.415, mas o total da receita bruta publicado na mesma nota não a inclui. O painel segue o total auditado, então essa linha aparece apenas em 2022 e 2023. As demonstrações de 2025 também reapresentam o saldo de 31 de dezembro de 2023, com passivo a descoberto de 612.910 depois de um ajuste de 6.678 pela adoção da ITG 2003 (R2). O painel mantém em 2023 o valor divulgado naquele ano, de 601.699.</div>`));
}},
];

/* =========================================================
   Navegação, filtros, tema
   ========================================================= */
const VISIVEIS=PAGES.filter(p=>!p.oculta);
let CUR='inicio';
const wrap=document.getElementById('wrap');
const BODY=document.body;
function fecharPaineis(){BODY.classList.remove('nav-open','filt-open');}

function go(id){
  if(!VISIVEIS.some(p=>p.id===id))id='inicio';
  CUR=id;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  document.getElementById('crumb').textContent=(PAGES.find(p=>p.id===id)||{}).nome||'';
  wrap.innerHTML='';
  const page=PAGES.find(p=>p.id===id);
  const el=document.createElement('div');el.className='page on';
  wrap.appendChild(el);
  page.render(el);
  fecharPaineis();
  tipHide();
  markScrollables(el);
  window.scrollTo({top:0,behavior:'instant'});
}
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=VISIVEIS.map(p=>`<a href="#${p.id}" data-id="${p.id}"><i></i>${esc(p.nome)}</a>`).join('');
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.id);}));
}
function buildFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='<span class="lbl">Ano</span>'+ANOS.map(y=>`<button class="chip${YEARS.has(y)?' on':''}" data-y="${y}">${y}</button>`).join('')
    +'<button class="chip ghost" data-y="all">Todos</button>'
    +'<button class="chip apply" data-y="ok">Concluir</button>';
  f.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const y=b.dataset.y;
    if(y==='ok'){fecharPaineis();return;}
    if(y==='all')YEARS=new Set(ANOS);
    else{const n=+y;if(YEARS.has(n)&&YEARS.size>1)YEARS.delete(n);else YEARS.add(n);}
    const aberto=BODY.classList.contains('filt-open');
    buildFilters();go(CUR);
    if(aberto)BODY.classList.add('filt-open'); /* no celular o painel continua aberto para vários toques */
  }));
  document.getElementById('filtN').textContent=YEARS.size;
}

/* no desktop o filtro vive na barra superior; no celular, num painel inferior */
const FILT=document.getElementById('filters'),SLOT=document.getElementById('filtSlot'),APP=document.querySelector('.app');
function aplicarModo(){
  const alvo=isMob()?APP:SLOT;
  if(FILT.parentElement!==alvo)alvo.appendChild(FILT);
}

/* menu deslizante e painel de anos (celular) */
document.getElementById('menuBtn').addEventListener('click',()=>{
  const aberto=BODY.classList.contains('nav-open');fecharPaineis();if(!aberto)BODY.classList.add('nav-open');
});
document.getElementById('filtBtn').addEventListener('click',()=>{
  const aberto=BODY.classList.contains('filt-open');fecharPaineis();if(!aberto)BODY.classList.add('filt-open');
});
document.getElementById('scrim').addEventListener('click',fecharPaineis);
document.getElementById('sideClose').addEventListener('click',fecharPaineis);
addEventListener('keydown',e=>{if(e.key==='Escape')fecharPaineis();});

document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  go(CUR);
});

/* ao girar o aparelho ou redimensionar, redesenha só quando o modo muda */
let MOD=isMob(),_rt;
addEventListener('resize',()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const m=isMob();
    if(m!==MOD){MOD=m;aplicarModo();go(CUR);}
    else markScrollables();
  },200);
});

aplicarModo();buildNav();buildFilters();
go(location.hash?location.hash.slice(1):'inicio');

</script>
</body>
